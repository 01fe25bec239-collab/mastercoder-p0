# PROTOTYPE — DISPOSABLE — NOT PRODUCTION (Mastercoder freeze-closure).
# Audit F-1/F-2: only protected-base code/scopes execute; PR branch/title and tree are untrusted data.
# Only this guard and common-arch-check.yml may use pull_request_target. Read-only token, no secrets.
name: write-set-guard
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
permissions:
  contents: read
jobs:
  write-set-guard:
    name: write-set-guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out the protected base revision only
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch -q --no-tags origin "$BASE_SHA" "$HEAD_SHA"
          git checkout -q --detach "$BASE_SHA"
      - name: Enforce ownership, exact scope, exclusions and matching task title
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: bash scripts/check_write_set.sh --pr "$BASE_SHA" "$HEAD_SHA" "$HEAD_REF" "$PR_TITLE"
