          def wait_file(path, process, bound):
              deadline = time.monotonic() + bound
              while not path.exists():
                  if process.poll() is not None:
                      raise RuntimeError('Fixture exited before readiness')
                  if time.monotonic() >= deadline:
                      raise TimeoutError('Fixture readiness exceeded bound')
                  threading.Event().wait(0.1)


          class PosixGuard:
              def __init__(self, root, config):
                  self.root, self.config = root, config
                  self.namespace = None
                  self.container = None
                  self.resolver = None
                  self.profile = root / 'seatbelt.sb'
                  self.prefix = []
                  self.cleanup_actions = []
                  self.fixture = None

              def setup(self, fixture):
                  timeout = self.config.seconds('SETUP')
                  if sys.platform == 'linux':
                      # Docker none namespace has no interface to the host/public network.
                      image = dict(line.split('=', 1) for line in (self.root / 'work/ws03-runner-sandbox-acquisition/.env.example').read_text().splitlines()
                                   if line.startswith('MC_WS03_POSTGRES_IMAGE='))['MC_WS03_POSTGRES_IMAGE']
                      checked(['docker', 'pull', image], timeout=timeout)
                      self.container = subprocess.check_output(linux_pg_command(image, fixture['pg_port']), text=True, timeout=timeout).strip()
                      fixture['pg_server_canary'] = '/tmp/ws03-postgres-data/__ws03_denied__'
                      pid = subprocess.check_output(['docker', 'inspect', '--format', '{{.State.Pid}}', self.container], text=True).strip()
                      if not re.fullmatch(r'[1-9][0-9]*', pid):
                          raise RuntimeError('Invalid owned namespace PID')
                      self.prefix = privileged(['/usr/bin/nsenter', '--target', pid, '--net', '--'])
                      if subprocess.check_output(self.prefix + ['nft', 'list', 'tables'], text=True).strip():
                          raise RuntimeError('Unexpected policy in owned namespace')
                      checked(self.prefix + ['sysctl', '-w', 'net.ipv6.conf.all.disable_ipv6=0'], timeout=timeout)
                      checked(self.prefix + ['sysctl', '-w', 'net.ipv6.conf.default.disable_ipv6=0'], timeout=timeout)
                      checked(self.prefix + ['ip', 'link', 'add', 'fixture0', 'type', 'dummy'], timeout=timeout)
                      checked(self.prefix + ['ip', 'link', 'set', 'fixture0', 'up'], timeout=timeout)
                      # RFC 5737 / RFC 4193 synthetic fixture addresses in this isolated namespace only.
                      fixture['ipv4'] = '192.0.2.1'
                      fixture['ipv6'] = str(ipaddress.IPv6Address((0xfd << 120) | (secrets.randbits(40) << 80) | 1))
                      checked(self.prefix + ['ip', 'addr', 'add', fixture['ipv4'] + '/32', 'dev', 'fixture0'], timeout=timeout)
                      checked(self.prefix + ['ip', '-6', 'addr', 'add', fixture['ipv6'] + '/128', 'dev', 'fixture0', 'nodad'], timeout=timeout)
                      fixture['dns_port'] = 53
                      # Low ports are unprivileged only inside this owned network namespace.
                      checked(self.prefix + ['/usr/sbin/sysctl', '-w', 'net.ipv4.ip_unprivileged_port_start=0'], cwd='/', timeout=timeout)
                      self.fixture_prefix = self.prefix + drop_identity()
                      ready = ['docker', 'exec', self.container, 'pg_isready', '-h', '127.0.0.1', '-p', str(fixture['pg_port']), '-U', PG_ROLE, '-d', PG_DATABASE]
                      deadline = time.monotonic() + timeout
                      while subprocess.run(ready, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode:
                          if time.monotonic() >= deadline:
                              raise TimeoutError('Owned PostgreSQL readiness exceeded bound')
                          threading.Event().wait(0.1)
                  else:
                      # Existing native interface addresses; no adapter/global firewall mutation.
                      listing = subprocess.check_output(['ifconfig'], text=True, timeout=timeout)
                      addresses, failures = mac_fixture_addresses(listing)
                      fixture['ipv4'], fixture['ipv6'] = addresses
                      (self.root / 'fixture-addresses.json').write_text(json.dumps({'selected': addresses, 'rejected': failures}))
                      fixture['dns_port'] = 0
                      self.fixture_prefix = []
