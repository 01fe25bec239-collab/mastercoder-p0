          struct Scope {
              HANDLE engine{};
              PSID sid{};
              GUID sublayer{};
              bool sublayer_added{};
              UINT64 filters[4]{};
          };

          static constexpr FWP_ACTION_TYPE loopback_action = FWP_ACTION_PERMIT;
          static constexpr FWP_ACTION_TYPE external_action = FWP_ACTION_BLOCK;

          static DWORD guid(GUID* value) {
              const RPC_STATUS result = UuidCreate(value);
              return result == RPC_S_OK || result == RPC_S_UUID_LOCAL_ONLY ? ERROR_SUCCESS : result;
          }

          static DWORD add_filter(Scope* scope, bool ipv6, bool loopback) {
              // Address constants are protocol loopback ranges, not deployment addresses.
              FWP_V4_ADDR_AND_MASK v4{0x7f000000, 0xff000000};
              FWP_V6_ADDR_AND_MASK v6{};
              v6.addr[15] = 1;
              v6.prefixLength = 128;
              FWPM_FILTER_CONDITION0 conditions[2]{};
              conditions[0].fieldKey = FWPM_CONDITION_ALE_PACKAGE_ID;
              conditions[0].matchType = FWP_MATCH_EQUAL;
              conditions[0].conditionValue.type = FWP_SID;
              conditions[0].conditionValue.sid = static_cast<SID*>(scope->sid);
              conditions[1].fieldKey = FWPM_CONDITION_IP_REMOTE_ADDRESS;
              conditions[1].matchType = FWP_MATCH_EQUAL;
              conditions[1].conditionValue.type = ipv6 ? FWP_V6_ADDR_MASK : FWP_V4_ADDR_MASK;
              if (ipv6) conditions[1].conditionValue.v6AddrMask = &v6;
              else conditions[1].conditionValue.v4AddrMask = &v4;
              FWPM_FILTER0 filter{};
              DWORD error = guid(&filter.filterKey);
              if (error) return error;
              filter.displayData.name = const_cast<wchar_t*>(L"W03 owned AppContainer nonloopback denial");
              filter.layerKey = ipv6 ? FWPM_LAYER_ALE_AUTH_CONNECT_V6 : FWPM_LAYER_ALE_AUTH_CONNECT_V4;
              filter.subLayerKey = scope->sublayer;
              // Microsoft Filter Arbitration: the higher-weight loopback soft permit is
              // evaluated first inside this fresh sublayer; remaining SID traffic hits a
              // hard block. Other providers' blocks are never overridden.
              filter.weight.type = FWP_UINT8;
              filter.weight.uint8 = loopback ? 15 : 0;
              filter.action.type = loopback ? loopback_action : external_action;
              filter.numFilterConditions = loopback ? 2 : 1;
              filter.filterCondition = conditions;
              return FwpmFilterAdd0(scope->engine, &filter, nullptr, &scope->filters[(ipv6 ? 2 : 0) + (loopback ? 1 : 0)]);
          }

          static bool address_is_loopback_exception(const FWP_CONDITION_VALUE0& value, bool ipv6) {
              if (!ipv6) return value.type == FWP_V4_ADDR_MASK && value.v4AddrMask &&
                  value.v4AddrMask->addr == 0x7f000000 && value.v4AddrMask->mask == 0xff000000;
              FWP_V6_ADDR_AND_MASK expected{};
              expected.addr[15] = 1;
              expected.prefixLength = 128;
              return value.type == FWP_V6_ADDR_MASK && value.v6AddrMask &&
                  value.v6AddrMask->prefixLength == expected.prefixLength &&
                  std::memcmp(value.v6AddrMask->addr, expected.addr, sizeof(expected.addr)) == 0;
          }

          extern "C" __declspec(dllexport) DWORD ScopeAttest(void* raw) {
              auto* scope = static_cast<Scope*>(raw);
              if (!scope || !scope->engine || !scope->sid) return ERROR_INVALID_HANDLE;
              for (int i = 0; i != 4; ++i) {
                  const bool ipv6 = i >= 2;
                  const bool loopback = i % 2 != 0;
                  FWPM_FILTER0* filter = nullptr;
                  const DWORD error = FwpmFilterGetById0(scope->engine, scope->filters[i], &filter);
                  if (error) return error;
                  const GUID& layer = ipv6 ? FWPM_LAYER_ALE_AUTH_CONNECT_V6 : FWPM_LAYER_ALE_AUTH_CONNECT_V4;
                  bool valid = filter && IsEqualGUID(filter->layerKey, layer) &&
                      IsEqualGUID(filter->subLayerKey, scope->sublayer) &&
                      filter->action.type == (loopback ? loopback_action : external_action) &&
                      filter->weight.type == FWP_UINT8 && filter->weight.uint8 == (loopback ? 15 : 0) &&
                      filter->flags == 0 && filter->numFilterConditions == (loopback ? 2u : 1u) && filter->filterCondition;
                  if (valid) {
                      const auto& package = filter->filterCondition[0];
                      valid = IsEqualGUID(package.fieldKey, FWPM_CONDITION_ALE_PACKAGE_ID) &&
                          package.matchType == FWP_MATCH_EQUAL && package.conditionValue.type == FWP_SID &&
                          package.conditionValue.sid && EqualSid(package.conditionValue.sid, scope->sid);
                      if (valid && loopback) {
                          const auto& remote = filter->filterCondition[1];
                          valid = IsEqualGUID(remote.fieldKey, FWPM_CONDITION_IP_REMOTE_ADDRESS) &&
                              remote.matchType == FWP_MATCH_EQUAL && address_is_loopback_exception(remote.conditionValue, ipv6);
                      }
                  }
                  FwpmFreeMemory0(reinterpret_cast<void**>(&filter));
                  if (!valid) return ERROR_INVALID_DATA;
              }
              return ERROR_SUCCESS;
          }

          extern "C" __declspec(dllexport) DWORD ScopeClose(void* raw) {
              auto* scope = static_cast<Scope*>(raw);
              if (!scope) return ERROR_INVALID_HANDLE;
              const UINT64 ids[4]{scope->filters[0], scope->filters[1], scope->filters[2], scope->filters[3]};
              const GUID sublayer = scope->sublayer;
              DWORD error = ERROR_SUCCESS;
              if (scope->engine) error = FwpmEngineClose0(scope->engine);
              // Verify the dynamic objects disappeared through a separate read-only query session.
              if (!error && scope->sublayer_added) {
                  HANDLE observer{};
                  error = FwpmEngineOpen0(nullptr, RPC_C_AUTHN_WINNT, nullptr, nullptr, &observer);
                  if (!error) {
                      for (UINT64 id : ids) {
                          if (!id) continue;
                          FWPM_FILTER0* found = nullptr;
                          const DWORD query = FwpmFilterGetById0(observer, id, &found);
                          if (found) FwpmFreeMemory0(reinterpret_cast<void**>(&found));
                          if (query != FWP_E_FILTER_NOT_FOUND) error = query ? query : ERROR_INVALID_DATA;
                      }
                      FWPM_SUBLAYER0* found = nullptr;
                      const DWORD query = FwpmSubLayerGetByKey0(observer, &sublayer, &found);
                      if (found) FwpmFreeMemory0(reinterpret_cast<void**>(&found));
                      if (query != FWP_E_SUBLAYER_NOT_FOUND) error = query ? query : ERROR_INVALID_DATA;
                      const DWORD close = FwpmEngineClose0(observer);
                      if (close && !error) error = close;
                  }
              }
              if (scope->sid) LocalFree(scope->sid);
              delete scope;
              return error;
          }

          extern "C" __declspec(dllexport) DWORD ScopeOpen(const wchar_t* text, void** output) {
              if (!text || !output) return ERROR_INVALID_PARAMETER;
              *output = nullptr;
              auto* scope = new (std::nothrow) Scope;
              if (!scope) return ERROR_OUTOFMEMORY;
              if (!ConvertStringSidToSidW(text, &scope->sid)) {
                  const DWORD error = GetLastError();
                  delete scope;
                  return error;
              }
              // Reject a non-package identity before any policy mutation.
              const SID_IDENTIFIER_AUTHORITY application{SECURITY_APP_PACKAGE_AUTHORITY};
              if (!IsValidSid(scope->sid) || *GetSidSubAuthorityCount(scope->sid) != SECURITY_APP_PACKAGE_RID_COUNT ||
                  std::memcmp(GetSidIdentifierAuthority(scope->sid), &application, sizeof(application)) != 0 ||
                  *GetSidSubAuthority(scope->sid, 0) != SECURITY_APP_PACKAGE_BASE_RID) {
                  LocalFree(scope->sid); delete scope; return ERROR_INVALID_SID;
              }
              FWPM_SESSION0 session{};
              DWORD error = guid(&session.sessionKey);
              session.flags = FWPM_SESSION_FLAG_DYNAMIC;
              session.displayData.name = const_cast<wchar_t*>(L"W03 owned temporary native CI session");
              if (!error) error = FwpmEngineOpen0(nullptr, RPC_C_AUTHN_WINNT, nullptr, &session, &scope->engine);
              if (!error) error = guid(&scope->sublayer);
              if (!error) {
                  FWPM_SUBLAYER0 layer{};
                  layer.subLayerKey = scope->sublayer;
                  layer.displayData.name = const_cast<wchar_t*>(L"W03 owned temporary AppContainer sublayer");
                  layer.weight = 0xffff;
                  // Random key collision returns an error. No preexisting object is reused.
                  error = FwpmSubLayerAdd0(scope->engine, &layer, nullptr);
                  scope->sublayer_added = error == ERROR_SUCCESS;
              }
              if (!error) error = add_filter(scope, false, false);
              if (!error) error = add_filter(scope, false, true);
              if (!error) error = add_filter(scope, true, false);
              if (!error) error = add_filter(scope, true, true);
              if (!error) error = ScopeAttest(scope);
              if (error) {
                  const DWORD cleanup = ScopeClose(scope);
                  return cleanup ? cleanup : error;
              }
              *output = scope;
              return ERROR_SUCCESS;
          }
          # WS03_WFP_END
          WS03_INLINE_ASSETS
      - name: Prepare admitted Linux namespace tools
        if: steps.change_gate.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo -n apt-get update
          sudo -n apt-get install --no-install-recommends -y iproute2 nftables
          for tool in cargo rustup docker nsenter unshare setpriv nft ip python sudo; do
            command -v "$tool" > /dev/null
          done
      - name: Native baseline, denial, descendants, PostgreSQL, mutation and workspace tests
        if: steps.change_gate.outputs.relevant == 'true'
        shell: bash
        env:
          WS03_CI_EVIDENCE: ${{ runner.temp }}/ws03-ci-evidence
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/ws03-native.py" run
      - name: Retain native provenance and control evidence
        if: always() && steps.change_gate.outputs.relevant == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ws03-linux-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ws03-ci-evidence
          retention-days: ${{ vars.MC_WS03_CI_RETENTION_DAYS || 1 }}
          if-no-files-found: error
  ws03-macos:
    name: ws03-macos
    needs: [ws03-ci]
    if: always() && needs.ws03-ci.outputs.relevant == 'true'
    runs-on: macos-15
    timeout-minutes: ${{ fromJSON(vars.MC_WS03_CI_JOB_MINUTES || '30') }}
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize reviewed CI-only native helpers
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib
          source = pathlib.Path('.github/workflows/ws03-ci.yml').read_text().splitlines()
          for label, name in (('PYTHON', 'ws03-native.py'), ('WFP', 'ws03-wfp.cpp')):
              start = source.index('          # WS03_' + label + '_BEGIN') + 1
              end = source.index('          # WS03_' + label + '_END')
              lines = source[start:end]
              assert all(not line or line.startswith('          ') for line in lines)
              pathlib.Path(os.environ['RUNNER_TEMP'], name).write_text('\n'.join(line[10:] for line in lines) + '\n')
          PY
      - name: Native baseline, denial, descendants, PostgreSQL, mutation and workspace tests
        if: success()
        shell: bash
        env:
          WS03_CI_EVIDENCE: ${{ runner.temp }}/ws03-ci-evidence
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/ws03-native.py" run
      - name: Retain native provenance and control evidence
        if: always() && true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ws03-macos-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ws03-ci-evidence
          retention-days: ${{ vars.MC_WS03_CI_RETENTION_DAYS || 1 }}
          if-no-files-found: error
  ws03-windows:
