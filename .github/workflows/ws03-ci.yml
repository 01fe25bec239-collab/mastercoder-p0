              def resolver_setup(self, fixture):
                  if sys.platform == 'darwin':
                      self.resolver = Path(self.config.values['MC_WS03_CI_MACOS_RESOLVER_DIRECTORY']) / fixture['domain']
                      # mkdir of standard resolver directory is bounded; preexisting per-job file is never reused.
                      checked(privileged(['/bin/mkdir', '-p', str(self.resolver.parent)]), cwd='/')
                      self.resolver = self.resolver.parent.resolve(strict=True) / self.resolver.name
                      for directory in (self.resolver.parent, *self.resolver.parent.parents):
                          info = directory.lstat()
                          if directory.is_symlink() or info.st_uid != 0 or info.st_mode & 0o022:
                              raise RuntimeError('Resolver parent is not root-owned and immutable')
                      content = ('nameserver ' + fixture['ipv4'] + '\nport ' + str(fixture['dns_port']) + '\n')
                      checked(privileged(['/bin/bash', '--noprofile', '--norc', '-c',
                          'set -eC; umask 022; printf "%s" "$2" > "$1"', 'ws03-resolver', self.resolver, content]),
                          cwd='/', timeout=self.config.seconds('SETUP'))
                      self.resolver_content = content
                  else:
                      resolver_file = self.root / 'resolv.conf'
                      resolver_file.write_text('nameserver ' + fixture['ipv4'] + '\noptions attempts:1 timeout:1\n')
                      # Never execute a test-writable file as root. An owned PID namespace
                      # terminates even descendants that create another session/group.
                      script = 'set -euo pipefail\nmount --bind "$1" /etc/resolv.conf\nshift\nexec "$@"\n'
                      self.resolver_prefix = self.prefix + ['unshare', '--mount', '--propagation', 'private',
                          '--pid', '--fork', '--kill-child', '--mount-proc', '--', 'bash', '-c', script, 'ws03-resolver',
                          str(resolver_file)] + drop_identity()

              def install(self):
                  if sys.platform == 'linux':
                      policy = ('table inet ws03_guard {\n'
                          '    chain output {\n'
                          '        type filter hook output priority 0; policy drop;\n'
                          '        ip daddr 127.0.0.0/8 accept\n'
                          '        ip6 daddr ::1 accept\n'
                          '    }\n'
                          '}\n')
                      # Exercise the real parser, including the original missing block separator.
                      invalid = 'table inet ws03_guard { chain output { type filter hook output priority 0; policy drop; } }\n'
                      rejected = subprocess.run(self.prefix + ['nft', '--check', '-f', '-'], input=invalid,
                          text=True, capture_output=True, timeout=self.config.seconds('SETUP'))
                      if rejected.returncode == 0 or 'syntax error' not in rejected.stderr:
                          raise RuntimeError('nft parser negative control failed')
                      checked(self.prefix + ['nft', '--check', '-f', '-'], input=policy, text=True,
                          timeout=self.config.seconds('SETUP'))
                      checked(self.prefix + ['nft', '-f', '-'], input=policy, text=True)
                      self.policy = policy

              def run(self, argv, cwd, env, guarded=True):
                  if sys.platform == 'linux':
                      prefix = self.resolver_prefix
                  else:
                      prefix = [self.seatbelt, '-f', str(self.profile)] if guarded else []
                  process = subprocess.Popen(prefix + ['env', '-i'] + [k + '=' + v for k, v in env.items()] + [str(x) for x in argv],
                                             cwd=cwd, start_new_session=True)
                  try:
                      code = process.wait(timeout=self.config.seconds('COMMAND'))
                      if code:
                          raise subprocess.CalledProcessError(code, argv)
                  finally:
                      # Kill remaining descendants even after a successful parent; exact owned session only.
                      self.kill_session(process.pid)
                      process.wait(timeout=self.config.seconds('CLEANUP'))

              def kill_session(self, pid):
                  if sys.platform == 'linux':
                      if not isinstance(pid, int) or pid <= 1:
                          raise ValueError('Invalid owned session PID')
                      body = 'if kill -0 -- -"$1" 2>/dev/null; then kill -KILL -- -"$1"; fi'
                      checked(privileged(['/bin/bash', '--noprofile', '--norc', '-c', body, 'ws03-kill', pid]),
                              cwd='/', timeout=self.config.seconds('CLEANUP'))
                  else:
                      try:
                          os.killpg(pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass

              def mutation(self):
                  if sys.platform == 'linux':
                      checked(self.prefix + ['nft', 'delete', 'table', 'inet', 'ws03_guard'])

              def cleanup(self):
                  failures = []
                  if self.fixture:
                      (self.root / 'stop').touch()
                      try:
                          code = self.fixture.wait(timeout=self.config.seconds('CLEANUP'))
                      except subprocess.TimeoutExpired:
                          try:
                              self.kill_session(self.fixture.pid)
                              self.fixture.wait(timeout=self.config.seconds('CLEANUP'))
                          except BaseException as error:
                              failures.append('Fixture drain: ' + str(error))
                      else:
                          if code:
                              failures.append('Fixture cleanup exit ' + str(code))
                  if self.resolver:
                      try:
                          compare, remove = trusted_system('/usr/bin/cmp'), trusted_system('/bin/rm')
                          checked(privileged(['/bin/bash', '--noprofile', '--norc', '-c',
                              'set -e; [[ -f "$1" && ! -L "$1" ]]; "$2" -s "$1" -; "$3" -- "$1"',
                              'ws03-resolver', self.resolver, compare, remove]), input=self.resolver_content,
                              text=True, cwd='/', timeout=self.config.seconds('CLEANUP'))
                      except BaseException as error:
                          failures.append(str(error))
                  if self.container:
                      try:
                          checked(['docker', 'rm', '--force', '--volumes', self.container], timeout=self.config.seconds('CLEANUP'))
                      except BaseException as error:
                          failures.append(str(error))
                  if failures:
                      raise RuntimeError('Owned cleanup failed: ' + ';'.join(failures))


          # PROTOTYPE — DISPOSABLE — NOT PRODUCTION (Mastercoder freeze-closure)
          def mac_pf_policy(uid):
              if type(uid) is not int or not 1000 <= uid < 2**31:
                  raise ValueError('Invalid exclusive CI UID')
              # Apple pf.conf(5): user matches effective socket creator, TCP/UDP only.
              # No state: every fresh packet must retain its UID/destination decision across mutations.
              return (f'pass out quick inet proto {{ tcp, udp }} from any to 127.0.0.0/8 user = {uid} flags any no state\n'
                      f'pass in quick inet proto {{ tcp, udp }} from 127.0.0.0/8 to any user = {uid} flags any no state\n'
                      f'pass out quick inet6 proto {{ tcp, udp }} from any to ::1 user = {uid} flags any no state\n'
                      f'pass in quick inet6 proto {{ tcp, udp }} from ::1 to any user = {uid} flags any no state\n'
                      f'block drop quick proto {{ tcp, udp }} all user = {uid}\n')


          def mac_pf_parent(main, listing):
              # Stock /etc/pf.conf prints a scrub-anchor beside the filter anchor. Stock /etc/pf.anchors/com.apple holds only
              # wildcard child references (200.AirDrop/*, 250.ApplicationFirewall/*); main's 'com.apple/*' wildcard evaluates
              # child rulesets, never these own rules, and every child's rules are bound separately. Any filter rule fails.
              rules = [line.strip() for line in main.splitlines() if line.strip()]
              rules = [line for line in rules if line != 'scrub-anchor "com.apple/*" all fragment reassemble']
              own = [line.strip() for line in listing.splitlines() if line.strip()]
              return rules == ['anchor "com.apple/*" all'] and all(re.fullmatch(r'anchor "[0-9A-Za-z._-]+/\*" all', line) for line in own)


          def mac_pf_attachment(main, nested, interfaces, listing):
              # Accept only the standard empty dynamic facility, not an assumed ordering around other filters.
              # macOS prints empty 'anchor "*" all { }' wrappers for nested rules.
              wrappers = {'anchor "*" all {', '}'}
              if (not mac_pf_parent(main, listing) or not wrappers.issuperset(line.strip() for line in nested.splitlines() if line.strip())
                      or not interfaces.strip() or re.search(r'\bskip\b', interfaces)):
                  raise RuntimeError('PF default anchor is absent, conflicting or skipped: ' + repr((main, listing, nested, interfaces))[:2000])


          def attest_mac_identity(config):
              uid, gid = config['mac_uid'], config['mac_gid']
              if (os.getuid() != uid or os.geteuid() != uid or os.getgid() != gid or os.getegid() != gid
                      or set(os.getgroups()) | {gid} != set(config['mac_groups']) or uid == 0 or gid == 0):
                  raise RuntimeError('Exclusive CI identity/group attestation failed')
              try:
                  os.seteuid(0)
              except PermissionError:
                  pass
              else:
                  raise RuntimeError('Exclusive CI identity can regain root')


          def mac_python_runtime(python, prefix):
              # python.org framework bin/python3.X is a hardened-runtime launcher: absolute install names load <prefix>/Python
              # (+ lib/*.dylib) and it re-executes <prefix>/Resources/Python.app. A copied tree still runs the installed one.
              python, prefix = Path(python), Path(prefix)
              if python == prefix or not python.is_relative_to(prefix):
                  raise RuntimeError('Python interpreter is outside its installed runtime prefix')
              app = prefix / 'Resources/Python.app/Contents/MacOS/Python'
              return [python] + ([app] if app.is_file() else [])


          def mac_profile(root, python, cargo, native_tools, developer, python_prefix):
              def literal(path):
                  return '(literal ' + json.dumps(str(path)) + ')'
              def subtree(path):
                  return '(subpath ' + json.dumps(str(path)) + ')'
              target = root / 'work/ws03-runner-sandbox-acquisition/target'
              writable = [root / name for name in ('home', 'temp', 'output')] + [target]
              locks = [root / 'cargo' / name for name in ('.package-cache', '.package-cache-mutate')]
              read = [subtree(path) for path in (python_prefix, root / 'toolchain', root / 'work', root / 'cargo',
                      root / 'rustup', Path('/System'), Path('/usr/lib'), Path('/usr/bin'), Path('/bin'),
                      Path('/Library/Developer'), developer, Path('/private/etc'))]
              read += [literal(root / name) for name in ('helper.py', 'tests.py', 'probe.json')]
              read += [literal(Path(path)) for path in ('/dev/null', '/dev/random', '/dev/urandom')]
              read += [subtree(path) for path in writable]
              return ('(version 1)\n(allow default)\n(deny network*)\n'
                      '(allow network-outbound (remote ip "localhost:*"))\n'
                      # Fresh UDP auto-bind may use a wildcard local socket; PF still filters its UID/peer.
                      '(allow network-bind (local ip "*:*"))\n'
                      '(allow network-inbound (local ip "localhost:*"))\n'
                      '(deny mach-lookup mach-register ipc-posix* iokit-open)\n'
                      '(deny file-link)\n(deny process-exec)\n(allow process-exec ' + ' '.join([literal(path) for path in mac_python_runtime(python, python_prefix)] + [literal(cargo),
                          literal(cargo.parent / 'rustc'), literal(cargo.parent / 'rustdoc'), subtree(target),
                          subtree(root / 'temp')] + [literal(path) for path in native_tools]) + ')\n'
                      # The python.org framework launcher reads the root directory itself (sandbox log: deny file-read-data /) and
                      # aborts silently without it; only the literal '/' entry list, never a subpath.
                      '(deny file-read* file-write*)\n(allow file-read-data (literal "/"))\n(allow file-read-metadata ' +
                      ' '.join(literal(path) for path in [root, *root.parents, *python.parents, *cargo.parents]) + ')\n(allow file-read* ' + ' '.join(read) + ')\n'
                      '(allow file-write* ' + ' '.join([subtree(path) for path in writable] + [literal(path) for path in locks]) + ' ' + literal(Path('/dev/null')) + ')\n')


          class MacCI(PosixGuard):
              """Disposable hosted-CI facility only; not the production F3 descendant/VM owner."""
              def __init__(self, root, config, python, cargo, python_prefix):
                  super().__init__(root, config)
                  self.python, self.cargo, self.python_prefix = python, cargo, python_prefix
                  self.runner_uid, self.runner_gid = os.getuid(), os.getgid()
                  if self.runner_uid == 0 or self.runner_gid == 0:
                      raise RuntimeError('CI controller must be unprivileged')
                  self.account = self.group = None
                  self.uid = self.gid = None
                  self.token = None
                  self.anchor = None
                  self.anchor_owned = False
                  self.loaded = False
                  self.guid = None
                  self.pf_expected = None
                  self.identity_ready = False
                  self.created_records = []

              def native(self, argv, **kwargs):
                  bound = self.config.seconds('SETUP')
                  if hasattr(self, 'cleanup_deadline'):
                      bound = min(bound, self.cleanup_deadline - time.monotonic())
                      if bound <= 0:
                          raise TimeoutError('Owned macOS cleanup deadline exceeded')
                  return checked(privileged(argv), cwd='/', timeout=bound,
                                 text=True, capture_output=True, **kwargs)

              def ds(self, *args):
                  return self.native(['/usr/bin/dscl', '.', *args]).stdout

              def pf(self, *args, **kwargs):
                  return self.native(['/sbin/pfctl', *args], **kwargs)

              def setup(self, fixture):
                  import plistlib, uuid
                  super().setup(fixture)
                  self.seatbelt = trusted_system('/usr/bin/sandbox-exec')
                  # Random names and an unused numeric pair are checked before the first record creation.
                  users, groups = self.ds('-list', '/Users', 'UniqueID'), self.ds('-list', '/Groups', 'PrimaryGroupID')
                  occupied = {int(line.split()[-1]) for line in (users + '\n' + groups).splitlines() if line.strip()}
                  self.uid = self.gid = next(value for value in range(1000, 2**31) if value not in occupied)
                  import pwd, grp
                  for lookup in (pwd.getpwuid, grp.getgrgid):
                      try:
                          lookup(self.uid)
                      except KeyError:
                          pass
                      else:
                          raise RuntimeError('Exclusive numeric identity collides with a directory identity')
                  name = '_ws03_' + secrets.token_hex(12)
                  if any(line.split()[0] == name for line in (users + '\n' + groups).splitlines() if line.strip()):
                      raise RuntimeError('Exclusive identity name collision')
                  self.guid = str(uuid.uuid4()).upper()
                  self.group_guid = str(uuid.uuid4()).upper()
                  self.group = '/Groups/' + name
                  self.account = '/Users/' + name
                  self.ds('-create', self.group, 'GeneratedUID', self.group_guid)
                  self.created_records.append(self.group)
                  self.ds('-create', self.group, 'PrimaryGroupID', str(self.gid))
                  self.ds('-create', self.account, 'GeneratedUID', self.guid)
                  self.created_records.append(self.account)
                  for key, value in [('UniqueID', str(self.uid)), ('PrimaryGroupID', str(self.gid)),
                          ('UserShell', '/usr/bin/false'), ('NFSHomeDirectory', str(self.root / 'home')),
                          ('Password', '*'), ('AuthenticationAuthority', ';DisabledUser;'), ('IsHidden', '1')]:
                      self.ds('-create', self.account, key, value)
                  self.allowed_groups = {self.gid}
                  for universal in ('everyone', 'localaccounts'):
                      value = self.ds('-read', '/Groups/' + universal, 'PrimaryGroupID').strip()
                      if not re.fullmatch(r'PrimaryGroupID: [1-9][0-9]*', value):
                          raise RuntimeError('Universal native group is absent or malformed')
                      self.allowed_groups.add(int(value.split()[-1]))
                  # macOS nests everyone/localaccounts inside groups such as com.apple.access_ssh, _developer and
                  # com.apple.sharepoint.group.1, so every local account inherits them. Allow exactly the
                  # transitive closure of groups nested under those two; admin/staff are never allowed.
                  records = plistlib.loads(self.native(['/usr/bin/dscl', '-plist', '.', '-readall', '/Groups', 'RecordName',
                                           'GeneratedUID', 'NestedGroups', 'PrimaryGroupID']).stdout.encode())
                  groups = [(r['dsAttrTypeStandard:RecordName'][0], r['dsAttrTypeStandard:GeneratedUID'][0],
                             r.get('dsAttrTypeStandard:NestedGroups', []), int(r['dsAttrTypeStandard:PrimaryGroupID'][0]))
                            for r in records if all('dsAttrTypeStandard:' + k in r for k in ('RecordName', 'GeneratedUID', 'PrimaryGroupID'))]
                  universal = {guid for name, guid, _, _ in groups if name in ('everyone', 'localaccounts')}
                  grew = True
                  while grew:
                      grew = False
                      for name, guid, nested, gid in groups:
                          if guid not in universal and universal.intersection(nested):
                              universal.add(guid)
                              if name not in ('admin', 'staff'):
                                  self.allowed_groups.add(gid)
                              grew = True
                  self.attest_account()
                  self.identity_ready = True
                  fixture.update(mac_uid=self.uid, mac_gid=self.gid, mac_groups=sorted(self.actual_groups))
                  self.native_tools = [Path('/usr/bin/cc'), Path('/usr/bin/xcrun'), Path('/usr/bin/uname')]
                  for tool in ('clang', 'ld', 'dsymutil'):
                      path = Path(subprocess.check_output(['/usr/bin/xcrun', '--find', tool], text=True,
                                  timeout=self.config.seconds('SETUP')).strip()).resolve(strict=True)
                      if not path.is_file() or path.stat().st_mode & 0o6000:
                          raise RuntimeError('Unsafe native Rust test compiler/linker')
                      self.native_tools.append(path)
                  self.developer = Path(subprocess.check_output(['/usr/bin/xcode-select', '-p'], text=True,
                                      timeout=self.config.seconds('SETUP')).strip()).resolve(strict=True)
                  if not self.developer.is_absolute() or not self.developer.is_dir():
                      raise RuntimeError('Missing installed native SDK')
                  self.profile.write_text(mac_profile(self.root, self.python, self.cargo, self.native_tools, self.developer, self.python_prefix))
                  self.anchor = 'com.apple/ws03_' + secrets.token_hex(12)
                  if self.pf('-a', self.anchor, '-sr').stdout.strip():
                      raise RuntimeError('Owned PF anchor collision')
                  mac_pf_attachment(self.pf('-sr').stdout, self.pf('-a', 'com.apple/*', '-sr').stdout,
                                    self.pf('-v', '-s', 'Interfaces').stdout, self.pf('-a', 'com.apple', '-sr').stdout)
                  result = self.pf('-E')
                  tokens = re.findall(r'^Token\s*:\s*([0-9]+)\s*$', result.stdout + result.stderr, re.MULTILINE)
                  if len(tokens) != 1:
                      raise RuntimeError('Owned PF enable reference token was not returned')
