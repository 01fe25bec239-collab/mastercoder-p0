              def attest_account(self):
                  if not self.account or not self.group or not self.guid:
                      raise RuntimeError('Exclusive identity is not owned')
                  for record in (self.account, self.group):
                      if self.ds('-read', record, 'GeneratedUID').strip() != 'GeneratedUID: ' + (self.group_guid if record == self.group else self.guid):
                          raise RuntimeError('Exclusive identity ownership changed')
                  expected = {'UniqueID': str(self.uid), 'PrimaryGroupID': str(self.gid), 'UserShell': '/usr/bin/false',
                              'Password': '*', 'AuthenticationAuthority': ';DisabledUser;'}
                  for key, value in expected.items():
                      if self.ds('-read', self.account, key).strip() != key + ': ' + value:
                          raise RuntimeError('Exclusive account authority changed: ' + key)
                  # id consults actual directory membership, including nested groups; no admin/staff inheritance.
                  ids = self.native(['/usr/bin/id', '-G', self.account.split('/')[-1]]).stdout.split()
                  self.actual_groups = {int(value) for value in ids}
                  if not ids or self.gid not in self.actual_groups or self.actual_groups - self.allowed_groups:
                      raise RuntimeError('Exclusive account has supplementary groups')

              def drop_prefix(self):
                  self.attest_account()
                  # sudo initializes target groups; never -P/preserve-groups. No arbitrary privileged helper.
                  return [trusted_system('/usr/bin/sudo'), '-n', '-u', '#' + str(self.uid), '-g', '#' + str(self.gid), '--']

              def prepare_access(self):
                  # Runner/controller owns every immutable byte. Account can traverse but not alter controls.
                  self.root.chmod(0o755)
                  readable = [self.root / name for name in ('toolchain', 'work', 'cargo', 'rustup', 'home', 'temp', 'output')]
                  for directory in readable:
                      for path in [directory, *directory.rglob('*')]:
                          if path.is_symlink():
                              raise RuntimeError('Redirected CI input/runtime path')
                          if path.is_dir():
                              path.chmod(0o755)
                          else:
                              path.chmod(0o755 if path.stat().st_mode & 0o111 else 0o644)
                  for name in ('helper.py', 'tests.py', 'probe.json', 'seatbelt.sb'):
                      path = self.root / name
                      if path.is_symlink() or not path.is_file():
                          raise RuntimeError('Redirected CI controller input')
                      path.chmod(0o644)
                  # PG data remains private even though source/runtime inputs are readable.
                  (self.root / 'postgres-data').chmod(0o700)
                  paths = [self.root / name for name in ('home', 'temp', 'output')]
                  paths.append(self.root / 'work/ws03-runner-sandbox-acquisition/target')
                  for path in paths:
                      if not path.is_dir() or path.is_symlink():
                          raise RuntimeError('Missing explicit CI output directory')
                      self.native(['/usr/sbin/chown', '-R', '-P', str(self.uid) + ':' + str(self.gid), str(path)])
                  locks = [self.root / 'cargo' / name for name in ('.package-cache', '.package-cache-mutate')]
                  for path in locks:
                      if path.is_symlink():
                          raise RuntimeError('Redirected Cargo cache lock')
                      path.touch(exist_ok=True)
                      self.native(['/usr/sbin/chown', str(self.uid) + ':' + str(self.gid), str(path)])
                  self.owned_outputs = paths + locks
                  self.access_ready = True
                  # Traversal to this random copied root must not grant access to the runner home.
                  for parent in self.root.parents:
                      info = parent.stat()
                      if not info.st_mode & 0o001:
                          raise RuntimeError('Copied CI root has an inaccessible parent; refusing broad parent permission changes: ' + str(parent))

              def install(self):
                  policy = mac_pf_policy(self.uid)
                  parsed = self.pf('-n', '-v', '-a', self.anchor, '-f', '-', input=policy)
                  if not parsed.stdout.strip():
                      raise RuntimeError('PF policy parser did not return normalized rules')
                  # A failed load may have installed rules; admission alone grants no cleanup authority.
                  self.anchor_owned = True
                  self.pf('-a', self.anchor, '-f', '-', input=policy)
                  self.loaded = True
                  rules = self.pf('-a', self.anchor, '-sr').stdout
                  lines = rules.splitlines()
                  if len(lines) != 10 or rules.strip() != parsed.stdout.strip():
                      raise RuntimeError('PF UID rule expansion did not match the owned policy')
                  # PF expands the TCP/UDP brace list. Bind exact normalized output for every subsequent entry.
                  self.pf_expected = rules
                  self.tree_expected = self.pf('-a', 'com.apple/*', '-sr').stdout
                  self.attest_policy()

              def attest_policy(self):
                  if not self.loaded or self.pf('-a', self.anchor, '-sr').stdout != self.pf_expected:
                      raise RuntimeError('Owned PF policy changed')
                  # A quick rule in our child terminates the main evaluation. Reject every other active filter.
                  main = self.pf('-sr').stdout
                  listing = self.pf('-a', 'com.apple', '-sr').stdout
                  tree = self.pf('-a', 'com.apple/*', '-sr').stdout
                  if not mac_pf_parent(main, listing) or tree != self.tree_expected:
                      raise RuntimeError('PF parent attachment changed: ' + repr((main, listing, tree))[:2000])
                  if re.search(r'\bskip\b', self.pf('-v', '-s', 'Interfaces').stdout):
                      raise RuntimeError('PF interface filtering was skipped')
                  if 'Status: Enabled' not in self.pf('-s', 'info').stdout:
                      raise RuntimeError('PF was disabled')
                  stats = self.pf('-a', self.anchor, '-v', '-s', 'rules').stdout
                  (self.root / 'pf-policy.txt').write_text(stats)

              def run(self, argv, cwd, env, guarded=True):
                  if not getattr(self, 'access_ready', False):
                      self.prepare_access()
                  prefix = self.drop_prefix()
                  sandbox = []
                  if guarded:
                      self.attest_policy()
                      sandbox = [self.seatbelt, '-f', str(self.profile)]
                  # FDs default to close-on-exec; no sockets created by the controller are passed to this UID.
                  clean = dict(env, PATH=str(self.cargo.parent) + ':/usr/bin:/bin', TMPDIR=str(self.root / 'temp'))
                  process = subprocess.Popen(prefix + [trusted_system('/usr/bin/env'), '-i'] +
                      [key + '=' + value for key, value in clean.items()] + sandbox + list(map(str, argv)),
                      cwd=cwd, start_new_session=True, close_fds=True, stdin=subprocess.DEVNULL)
                  try:
                      code = process.wait(timeout=self.config.seconds('COMMAND'))
                      if code:
                          raise subprocess.CalledProcessError(code, argv)
                  finally:
                      self.drain_uid()
                      process.wait(timeout=self.config.seconds('CLEANUP'))

              def drain_uid(self):
                  self.attest_account()
                  # Exact exclusive UID, including a child that changed session; never a name-pattern/wildcard kill.
                  result = subprocess.run(privileged(['/usr/bin/pkill', '-KILL', '-u', str(self.uid)]),
                      cwd='/', capture_output=True, text=True, timeout=self.config.seconds('CLEANUP'))
                  if result.returncode not in (0, 1):
                      raise RuntimeError('Exclusive UID process kill failed')
                  deadline = min(time.monotonic() + self.config.seconds('CLEANUP'),
                                 getattr(self, 'cleanup_deadline', float('inf')))
                  while True:
                      result = subprocess.run(privileged(['/usr/bin/pgrep', '-u', str(self.uid)]),
                          cwd='/', capture_output=True, text=True, timeout=self.config.seconds('CLEANUP'))
                      if result.returncode == 1:
                          return
                      if result.returncode != 0 or time.monotonic() >= deadline:
                          raise RuntimeError('Exclusive UID process drain incomplete')
                      threading.Event().wait(0.05)

              def mutation(self):
                  self.attest_policy()
                  self.pf('-a', self.anchor, '-f', '-', input='')
                  if self.pf('-a', self.anchor, '-sr').stdout.strip():
                      raise RuntimeError('Owned PF rules were not removed')
                  self.loaded = False

              def cleanup(self):
                  failures = []
                  self.cleanup_deadline = time.monotonic() + self.config.seconds('CLEANUP')
                  # A partially created account is cleaned only when its ownership GUID matches.
                  if self.identity_ready:
                      try:
                          self.drain_uid()
                      except BaseException as error:
                          failures.append('identity-drain:' + str(error))
                  if getattr(self, 'access_ready', False) and not failures:
                      for path in self.owned_outputs:
                          try:
                              self.native(['/usr/sbin/chown', '-R', '-P', str(self.runner_uid) + ':' + str(self.runner_gid), str(path)])
                          except BaseException as error:
                              failures.append('output-custody:' + str(error))
                  if (self.anchor_owned or self.token) and not failures:
                      try:
                          if self.anchor_owned:
                              self.pf('-a', self.anchor, '-f', '-', input='')
                              if self.pf('-a', self.anchor, '-sr').stdout.strip():
                                  raise RuntimeError('Owned PF anchor cleanup incomplete')
                          if self.token:
                              self.pf('-X', self.token)
                              self.token = None
                      except BaseException as error:
                          failures.append('pf-cleanup:' + str(error))
                  try:
                      super().cleanup()
                  except BaseException as error:
                      failures.append(str(error))
                  if self.account and self.guid and not failures:
                      for record in reversed(self.created_records):
                          try:
                              if self.ds('-read', record, 'GeneratedUID').strip() != 'GeneratedUID: ' + (self.group_guid if record == self.group else self.guid):
                                  raise RuntimeError('Refusing to remove unowned account/group')
                              self.ds('-delete', record)
                          except BaseException as error:
                              failures.append('identity-cleanup:' + str(error))
                  if failures:
                      raise RuntimeError('Owned macOS cleanup failed: ' + ';'.join(failures))


