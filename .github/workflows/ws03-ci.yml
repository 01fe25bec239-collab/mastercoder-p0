          def windows_scoped_ipv6(address, index):
              # Get-NetIPAddress already reports link-local addresses with their %zone; append it only when absent.
              if ipaddress.ip_address(address).is_link_local and '%' not in address:
                  return address + '%' + str(index)
              return address


          class WindowsCI:
              def __init__(self, root, config):
                  self.root, self.config = root, config
                  self.native = WindowsGuard(root, 'ws03.' + secrets.token_hex(12), config.seconds('COMMAND'))
                  self.fixture_prefix = []
                  self.fixture = None
                  self.rule_name = None
                  self.rule_domain = None
                  self.wfp_handle = ctypes.c_void_p()
                  self.wfp = None

              def ps(self, body, arguments=()):
                  script = self.root / ('setup-' + secrets.token_hex(4) + '.ps1')
                  if body.startswith('param('):
                      first, body = body.split('\n', 1)
                      body = first + "\n$ErrorActionPreference = 'Stop'\n" + body
                  else:
                      body = "$ErrorActionPreference = 'Stop'\n" + body
                  script.write_text(body)
                  return subprocess.check_output(['powershell.exe', '-NoProfile', '-NonInteractive', '-File', str(script),
                                                  *map(str, arguments)], text=True, timeout=self.config.seconds('SETUP'))

              def setup(self, fixture):
                  addresses = json.loads(self.ps("Get-NetIPAddress -AddressState Preferred | Select-Object IPAddress,InterfaceIndex | ConvertTo-Json\n"))
                  fixture['ipv4'] = next(x['IPAddress'] for x in addresses if ':' not in x['IPAddress']
                                        and not ipaddress.ip_address(x['IPAddress']).is_loopback)
                  v6 = next(x for x in addresses if ':' in x['IPAddress'] and not ipaddress.ip_address(x['IPAddress']).is_loopback)
                  fixture['ipv6'] = windows_scoped_ipv6(v6['IPAddress'], v6['InterfaceIndex'])
                  fixture['dns_port'] = 53
                  self.native.setup()
                  fixture['package_sid'] = self.native.sid_text
                  fixture['protected_write_targets'] = [str(self.root / name) for name in
                      ('helper.py', 'tests.py', 'python/Lib/os.py', 'python/Lib/__ws03_denied__.py',
                       'toolchain/bin/rustc.exe', 'wfp_scope.dll', 'probe.json', 'fixture.json', 'ready.json',
                       'dns.log', 'compile-wfp.cmd', 'postgres-data/postmaster.pid', 'postgres-data/__ws03_denied__')]
                  fixture['protected_pid'] = str(self.root / 'postgres-data/postmaster.pid')

              def resolver_setup(self, fixture):
                  # One job-owned DNS suffix rule; never rewrite an adapter's/global DNS configuration.
                  owner = self.native.name
                  self.rule_domain = fixture['domain']
                  rule = self.ps("param($suffix,$address,$owner)\n"
                      "$existing = @(Get-DnsClientNrptRule | Where-Object { $_.Namespace -contains ('.' + $suffix) })\n"
                      "if ($existing.Count -ne 0) { throw 'DNS fixture namespace collision' }\n"
                      "Add-DnsClientNrptRule -Namespace ('.' + $suffix) -NameServers $address -Comment $owner -PassThru | Select-Object -ExpandProperty Name\n",
                      (fixture['domain'], fixture['ipv4'], owner)).strip()
                  if not re.fullmatch(r'\{?[0-9a-fA-F-]{36}\}?', rule):
                      raise RuntimeError('Expected owned NRPT rule GUID')
                  self.rule_name = rule

              def install(self):
                  self.wfp_open()

              def wfp_open(self):
                  if self.wfp_handle.value:
                      raise RuntimeError('WFP session already installed')
                  if self.wfp is None:
                      self.wfp = ctypes.WinDLL(str(self.root / 'wfp_scope.dll'))
                      self.wfp.ScopeOpen.restype = ctypes.c_uint32
                      self.wfp.ScopeOpen.argtypes = [ctypes.c_wchar_p, ctypes.POINTER(ctypes.c_void_p)]
                      self.wfp.ScopeAttest.restype = ctypes.c_uint32
                      self.wfp.ScopeAttest.argtypes = [ctypes.c_void_p]
                      self.wfp.ScopeClose.restype = ctypes.c_uint32
                      self.wfp.ScopeClose.argtypes = [ctypes.c_void_p]
                  code = self.wfp.ScopeOpen(self.native.sid_text, ctypes.byref(self.wfp_handle))
                  if code:
                      raise RuntimeError('Owned WFP setup failed: ' + str(code))
                  if self.wfp.ScopeAttest(self.wfp_handle):
                      raise RuntimeError('Owned WFP policy readback failed')

              def run(self, argv, cwd, env, guarded=True):
                  if guarded and (not self.wfp_handle.value or self.wfp.ScopeAttest(self.wfp_handle)):
                      raise RuntimeError('Missing owned WFP policy before restricted process')
                  # Without owned std handles the child inherits invalid controller handle values: Python's subprocess then
                  # fails DuplicateHandle (WinError 6) and its traceback is lost. Bounded log, retained via output/.
                  log = self.root / 'output' / ('native-' + secrets.token_hex(4) + '.log')
                  code = self.native.run(list(map(str, argv)), str(cwd), env, guarded, stdio=(None, log))
                  if guarded and self.wfp.ScopeAttest(self.wfp_handle):
                      raise RuntimeError('Owned WFP policy changed during restricted process')
                  if code:
                      sys.stderr.write(log.read_text(errors='replace')[-8192:])
                      raise subprocess.CalledProcessError(code, argv)

              def mutation(self):
                  # The full removed-guard mutation omits both AppContainer and its scoped WFP filters.
                  code = self.wfp.ScopeClose(self.wfp_handle)
                  self.wfp_handle = ctypes.c_void_p()
                  if code:
                      raise RuntimeError('Owned WFP mutation cleanup failed: ' + str(code))

              def cleanup(self):
                  if self.native.active_jobs:
                      raise RuntimeError('Owned Jobs not verified drained; retaining WFP and control storage')
                  failures = []
                  if self.fixture:
                      (self.root / 'stop').touch()
                      try:
                          if self.fixture.wait(timeout=self.config.seconds('CLEANUP')):
                              raise RuntimeError('Fixture exited with cleanup failure')
                      except BaseException as error:
                          self.fixture.kill()
                          self.fixture.wait(timeout=self.config.seconds('CLEANUP'))
                          failures.append(str(error))
                  if self.wfp_handle.value and not failures:
                      code = self.wfp.ScopeClose(self.wfp_handle)
                      self.wfp_handle = ctypes.c_void_p()
                      if code:
                          failures.append('WFP session cleanup/readback failed: ' + str(code))
                  if self.wfp is not None and not failures:
                      release = self.native.k.FreeLibrary
                      release.argtypes, release.restype = [ctypes.c_void_p], ctypes.c_int
                      if not release(self.wfp._handle):
                          failures.append('FreeLibrary failed: ' + str(ctypes.get_last_error()))
                      else:
                          self.wfp = None  # No native calls or function references after release.
                  if self.rule_domain:
                      try:
                          self.ps("param($name,$owner,$suffix)\n"
                              "$owned = @(Get-DnsClientNrptRule | Where-Object { $_.Comment -eq $owner -and $_.Namespace -contains ('.' + $suffix) })\n"
                              "if ($owned.Count -gt 1) { throw 'Ambiguous owned DNS rules' }\n"
                              "if ($name -and ($owned.Count -ne 1 -or $owned[0].Name -ne $name)) { throw 'DNS rule ownership changed' }\n"
                              "foreach ($rule in $owned) { Remove-DnsClientNrptRule -Name $rule.Name -Force }\n"
                              "if (@(Get-DnsClientNrptRule | Where-Object { $_.Comment -eq $owner }).Count) { throw 'DNS rule cleanup incomplete' }\n",
                              (self.rule_name or '', self.native.name, self.rule_domain))
                      except BaseException as error:
                          failures.append(str(error))
                  if failures:
                      raise RuntimeError('Owned Windows cleanup failed; retaining guard: ' + ';'.join(failures))
                  try:
                      self.native.cleanup()
                  except BaseException as error:
                      failures.append(str(error))
                  if failures:
                      raise RuntimeError('Owned Windows cleanup failed: ' + ';'.join(failures))


          class WindowsPostgres:
              """Foreground postgres in an owned, drained Job; no postmaster.pid authority."""
              def __init__(self, native, config):
                  self.native, self.config = native, config
                  self.cancel = threading.Event()
                  self.errors = []
                  self.thread = None

              def single(self, argv, sql, root, env):
                  # Fixed SQL from an owned file on stdin; output to an owned file, read back as a bounded tail.
                  source, output = root / 'postgres-bootstrap.sql', root / 'postgres-bootstrap.out'
                  source.write_text(sql)
                  code = self.native.run(argv, str(root), env, False, restricted=True, stdio=(source, output))
                  with output.open('rb') as stream:
                      stream.seek(max(0, stream.seek(0, os.SEEK_END) - 65536))
                      return code, stream.read().decode('utf-8', 'replace').replace('\r\n', '\n')

              def start(self, argv, root, env, port):
                  def serve_owned():
                      try:
                          code = self.native.run(argv, str(root), env, False, cancel=self.cancel,
                                                 restricted=True, stdio=(None, root / 'postgres.log'))
                          if code or not self.cancel.is_set():
                              raise RuntimeError('Owned PostgreSQL exited before cancellation: ' + str(code))
                      except BaseException as error:
                          self.errors.append(str(error))
                  self.thread = threading.Thread(target=serve_owned)
                  self.thread.start()
                  deadline = time.monotonic() + self.config.seconds('SETUP')
                  while True:
                      if self.errors or not self.thread.is_alive():
                          raise RuntimeError('Owned PostgreSQL startup failed: ' + ';'.join(self.errors))
                      try:
                          query_pg(port, self.config.seconds('PROBE'))
                          return
                      except (OSError, RuntimeError):
                          if time.monotonic() >= deadline:
                              raise TimeoutError('Owned PostgreSQL readiness exceeded bound')
                          self.cancel.wait(0.1)

              def stop(self):
                  self.cancel.set()
                  if self.thread is not None:
                      self.thread.join(self.config.seconds('CLEANUP'))
                      if self.thread.is_alive():
                          raise RuntimeError('Owned PostgreSQL Job drain incomplete')
                  if self.errors:
                      raise RuntimeError('Owned PostgreSQL Job failure: ' + ';'.join(self.errors))


          def run_ci():
              if os.environ.get('GITHUB_ACTIONS') != 'true' or os.environ.get('RUNNER_ENVIRONMENT') != 'github-hosted':
                  raise RuntimeError('Native probes require the admitted standard GitHub-hosted job')
              repo = Path(os.environ['GITHUB_WORKSPACE'])
              evidence = Path(os.environ['WS03_CI_EVIDENCE'])
              evidence.mkdir()
              # The sandbox account must traverse every parent. /Users/runner is not world-searchable on hosted macOS and
              # widening it is refused, so the disposable macOS root lives under the standard shared directory instead.
              base = Path('/Users/Shared') if sys.platform == 'darwin' else Path(os.environ['RUNNER_TEMP'])
              root = base / ('ws03-' + secrets.token_hex(8))
              try:
                  config = Config(repo / 'ws03-runner-sandbox-acquisition')
                  root.mkdir()
                  run_ci_owned(repo, config, root, evidence)
              except BaseException as error:
                  (evidence / 'failure.json').write_text(json.dumps({'type': type(error).__name__, 'reason': str(error)[:4096]}))
                  raise
              finally:
                  # Early build/acquisition failure starts no native guard/service. Once services
                  # start, run_ci_owned's finally must finish before the owned copied root is removed.
                  if root.exists() and not (evidence / 'cleanup.json').exists():
                      shutil.rmtree(root)
                      (evidence / 'cleanup.json').write_text(json.dumps({'early_setup': True, 'copied_root_removed': True}))
                  manifest = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in evidence.iterdir()
                              if p.is_file() and p.name != 'sha256.json'}
                  (evidence / 'sha256.json').write_text(json.dumps(manifest, indent=2))


          def wait_listener_closed(port, timeout, bound):
              # A Job reports zero active processes before process rundown closes the dead postmaster's socket handles,
              # so one immediate connect can still reach it. Poll until refused; a listener beyond the bound fails.
              deadline = time.monotonic() + bound
              while True:
                  try:
                      with socket.create_connection(('127.0.0.1', port), timeout):
