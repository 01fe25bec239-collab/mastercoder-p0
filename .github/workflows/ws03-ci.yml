# PROTOTYPE — DISPOSABLE — NOT PRODUCTION (Mastercoder freeze-closure)
# T000 CI only. Hosted native runtime is mandatory, pending actual authorized execution.
name: ws03-ci
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ws03-native-ci
  cancel-in-progress: false
jobs:
  ws03-ci:
    name: ws03-ci
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(vars.MC_WS03_CI_JOB_MINUTES || '30') }}
    outputs:
      relevant: ${{ steps.change_gate.outputs.relevant }}
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether W03 checks are required
        id: change_gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          changed_paths="$RUNNER_TEMP/ws03-ci-changed-paths"
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            empty_tree="$(git hash-object -t tree /dev/null)"
            git diff --name-only --no-renames -z "$empty_tree" HEAD > "$changed_paths"
          else
            [[ "$BASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
            git cat-file -e "${BASE_SHA}^{commit}"
            merge_base="$(git merge-base "$BASE_SHA" HEAD)"
            git diff --name-only --no-renames -z "$merge_base" HEAD > "$changed_paths"
          fi
          relevant=false
          while IFS= read -r -d '' path; do
            case "$path" in
              ws03-runner-sandbox-acquisition|ws03-runner-sandbox-acquisition/*|.github/workflows/ws03-ci.yml|ws01-core-security/crates/*|ws01-core-security/doubles/*|ws01-core-security/Cargo.toml|rust-toolchain.toml|deny.toml|ARCHITECTURE/V2_1/*)
                relevant=true
                break
                ;;
            esac
          done < "$changed_paths"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          if [[ "$relevant" == false ]]; then
            echo "No W03 or current upstream CI inputs changed; remaining checks are skipped."
          fi
      - name: Materialize reviewed CI-only native helpers
        if: steps.change_gate.outputs.relevant == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib
          source = pathlib.Path('.github/workflows/ws03-ci.yml').read_text().splitlines()
          for label, name in (('PYTHON', 'ws03-native.py'), ('WFP', 'ws03-wfp.cpp')):
              start = source.index('          # WS03_' + label + '_BEGIN') + 1
              end = source.index('          # WS03_' + label + '_END')
              lines = source[start:end]
              assert all(not line or line.startswith('          ') for line in lines)
              pathlib.Path(os.environ['RUNNER_TEMP'], name).write_text('\n'.join(line[10:] for line in lines) + '\n')
          PY
          : <<'WS03_INLINE_ASSETS'
          # WS03_PYTHON_BEGIN
          # PROTOTYPE — DISPOSABLE — NOT PRODUCTION (Mastercoder freeze-closure)
          """Native Windows CI adapter, locally authored; native execution NOT_RUN.

          Contracts checked 2026-10-14 against Microsoft Learn and microsoft/win32metadata:
          https://learn.microsoft.com/en-us/windows/win32/secauthz/implementing-an-appcontainer
          https://learn.microsoft.com/en-us/windows/win32/api/processthreadsapi/nf-processthreadsapi-updateprocthreadattribute
          https://learn.microsoft.com/en-us/windows/win32/procthread/job-objects
          https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/icacls
          https://learn.microsoft.com/en-us/windows/security/operating-system-security/network-security/windows-firewall/troubleshooting-uwp-firewall

          The caller owns a fresh disposable copied tree and a fresh random profile name.
          No shared checkout/toolchain ACL is modified. Loopback exemption covers the
          profile, not one port. Call setup/cleanup from the same Windows user identity.
          Caller disposes the copied tree after cleanup; its low label is never restored
          onto a shared path. guarded=False is limited to fixture mutation controls and the owned PostgreSQL service.
          """
          import ctypes as C
          import math
          import os
          from pathlib import Path
          import re
          import subprocess
          import time

          DWORD, WORD, BOOL = C.c_uint32, C.c_uint16, C.c_int32
          HANDLE, PTR, SIZE = C.c_void_p, C.c_void_p, C.c_size_t
          PDWORD = C.POINTER(DWORD)


          class SID_AND_ATTRIBUTES(C.Structure):
              _fields_ = [("Sid", PTR), ("Attributes", DWORD)]


          class SECURITY_CAPABILITIES(C.Structure):
              _fields_ = [("AppContainerSid", PTR), ("Capabilities", PTR),
                          ("CapabilityCount", DWORD), ("Reserved", DWORD)]


          class STARTUPINFO(C.Structure):
              _fields_ = [("cb", DWORD), ("lpReserved", PTR), ("lpDesktop", PTR),
                          ("lpTitle", PTR)] + [(name, DWORD) for name in (
                              "dwX", "dwY", "dwXSize", "dwYSize", "dwXCountChars",
                              "dwYCountChars", "dwFillAttribute", "dwFlags")] + [
                          ("wShowWindow", WORD), ("cbReserved2", WORD),
                          ("lpReserved2", PTR), ("hStdInput", HANDLE),
                          ("hStdOutput", HANDLE), ("hStdError", HANDLE)]


          class STARTUPINFOEX(C.Structure):
              _fields_ = [("StartupInfo", STARTUPINFO), ("lpAttributeList", PTR)]


          class PROCESS_INFORMATION(C.Structure):
              _fields_ = [("hProcess", HANDLE), ("hThread", HANDLE),
                          ("dwProcessId", DWORD), ("dwThreadId", DWORD)]


          class BASIC_LIMITS(C.Structure):
              _fields_ = [("PerProcessUserTimeLimit", C.c_int64),
                          ("PerJobUserTimeLimit", C.c_int64), ("LimitFlags", DWORD),
                          ("MinimumWorkingSetSize", SIZE), ("MaximumWorkingSetSize", SIZE),
                          ("ActiveProcessLimit", DWORD), ("Affinity", SIZE),
                          ("PriorityClass", DWORD), ("SchedulingClass", DWORD)]


          class IO_COUNTERS(C.Structure):
              _fields_ = [(name, C.c_uint64) for name in (
                  "ReadOperationCount", "WriteOperationCount", "OtherOperationCount",
                  "ReadTransferCount", "WriteTransferCount", "OtherTransferCount")]


          class EXTENDED_LIMITS(C.Structure):
              _fields_ = [("BasicLimitInformation", BASIC_LIMITS), ("IoInfo", IO_COUNTERS)] + [
                  (name, SIZE) for name in ("ProcessMemoryLimit", "JobMemoryLimit",
                                           "PeakProcessMemoryUsed", "PeakJobMemoryUsed")]


          class ACCOUNTING(C.Structure):
              _fields_ = [(name, C.c_int64) for name in (
                  "TotalUserTime", "TotalKernelTime", "ThisPeriodTotalUserTime",
                  "ThisPeriodTotalKernelTime")] + [(name, DWORD) for name in (
                  "TotalPageFaultCount", "TotalProcesses", "ActiveProcesses",
                  "TotalTerminatedProcesses")]


          # WinBase.h/winnt.h constants, defined once; not deployment configuration.
          SECURITY_ATTRIBUTE, JOB_ATTRIBUTE = 0x20009, 0x2000D
          EXTENDED_STARTUP, UNICODE_ENVIRONMENT, SUSPENDED = 0x80000, 0x400, 0x4
          KILL_ON_CLOSE, TOKEN_QUERY, INSUFFICIENT_BUFFER = 0x2000, 0x8, 122
          WAIT_OBJECT_0, WAIT_TIMEOUT, WAIT_FAILED = 0, 258, 0xFFFFFFFF
          TOKEN_INTEGRITY, TOKEN_APPCONTAINER, TOKEN_CAPABILITIES, TOKEN_PACKAGE = 25, 29, 30, 31
          LOW_INTEGRITY, REPARSE_POINT = 0x1000, 0x400
          HANDLE_ATTRIBUTE, USE_STD_HANDLES, TOKEN_ALL_ACCESS, DISABLE_MAX_PRIVILEGE = 0x20002, 0x100, 0xF01FF, 0x1
          TOKEN_USER, TOKEN_GROUPS, TOKEN_PRIVILEGES, TOKEN_DEFAULT_DACL = 1, 2, 3, 6
          ACL_REVISION, ACL_SIZE_INFO, OBJECT_INHERIT, GENERIC_ALL = 2, 2, 0x1, 0x10000000
          ADMINS, POWER_USERS, GROUP_ENABLED, GROUP_DENY_ONLY = "S-1-5-32-544", "S-1-5-32-547", 0x4, 0x10


          class LUID_AND_ATTRIBUTES(C.Structure):
              _fields_ = [("LowPart", DWORD), ("HighPart", C.c_int32), ("Attributes", DWORD)]


          class ACL_SIZE(C.Structure):
              _fields_ = [("AceCount", DWORD), ("AclBytesInUse", DWORD), ("AclBytesFree", DWORD)]


          def validate_token_shape(is_container, same_sid, capability_count, integrity):
              if (is_container, same_sid, capability_count, integrity) != (1, True, 0, LOW_INTEGRITY):
                  raise RuntimeError("AppContainer token shape differs from zero-capability low-IL policy")


          def validate_restricted_token(user, expected_user, groups, privileges):
              """PostgreSQL check_root()/pgwin32_is_admin(): same user, admin groups deny-only, only change-notify."""
              if (user != expected_user or set(privileges) - {"SeChangeNotifyPrivilege"} or any(
                      groups[sid] & GROUP_ENABLED or not groups[sid] & GROUP_DENY_ONLY
                      for sid in (ADMINS, POWER_USERS) if sid in groups)):
                  raise RuntimeError("PostgreSQL token retains another user, an administrator group or a privilege")


          def environment_block(env):
              """Explicit caller-sanitized map; never inherit the host environment."""
              entries, seen = [], set()
              for key, value in env.items():
                  if not isinstance(key, str) or not isinstance(value, str):
                      raise ValueError("environment must contain strings")
                  folded = key.upper()
                  if not key or "=" in key or "\0" in key + value or folded in seen:
                      raise ValueError("invalid or duplicate environment key")
                  if folded.startswith(("GITHUB_", "AWS_", "AZURE_", "GOOGLE_", "OPENAI_")) or folded == "SSH_AUTH_SOCK":
                      raise ValueError("provider or host credential environment forbidden")
                  seen.add(folded)
                  entries.append((folded, key + "=" + value))
              return "\0".join(value for _, value in sorted(entries)) + "\0\0"


          class WindowsGuard:
              def __init__(self, root, name, timeout):
                  if os.name != "nt":
                      raise RuntimeError("WindowsGuard native runtime NOT_RUN on this host")
                  if not re.fullmatch(r"[-_. A-Za-z0-9]{1,64}", name):
                      raise ValueError("invalid AppContainer profile name")
                  if not math.isfinite(timeout) or not 0 < timeout * 1000 < WAIT_FAILED:
                      raise ValueError("invalid bounded timeout")
                  self.root = Path(os.path.abspath(root))
                  if not self.root.is_dir() or self.root == Path(self.root.anchor):
                      raise ValueError("root must be an existing disposable copied directory")
                  self.name, self.timeout = name, timeout
                  self.sid, self.created, self.exempt, self.closed = PTR(), False, False, False
                  self.sid_text = None
                  self.profile_folder = None
                  self.active_jobs = set()
                  self.k = C.WinDLL("kernel32", use_last_error=True)
                  self.a = C.WinDLL("advapi32", use_last_error=True)
                  self.u = C.WinDLL("userenv", use_last_error=True)
                  self.f = C.WinDLL("FirewallAPI", use_last_error=True)
                  self.o = C.WinDLL("ole32", use_last_error=True)
                  self._bind()
                  # Compute OS utility location; it is not supplied by untrusted PATH.
                  buffer = C.create_unicode_buffer(32768)
                  n = self.k.GetSystemDirectoryW(buffer, len(buffer))
                  if n == 0 or n >= len(buffer):
                      raise C.WinError(C.get_last_error())
                  self.system = Path(buffer.value)
                  self._check_path(self.root)

              def _bind(self):
                  prototypes = [
                      (self.u, "CreateAppContainerProfile", C.c_int32, [C.c_wchar_p]*3 + [PTR, DWORD, C.POINTER(PTR)]),
                      (self.u, "DeleteAppContainerProfile", C.c_int32, [C.c_wchar_p]),
                      (self.u, "GetAppContainerFolderPath", C.c_int32, [C.c_wchar_p, C.POINTER(PTR)]),
                      (self.o, "CoTaskMemFree", None, [PTR]),
                      (self.a, "FreeSid", PTR, [PTR]),
                      (self.a, "ConvertSidToStringSidW", BOOL, [PTR, C.POINTER(PTR)]),
                      (self.a, "ConvertStringSidToSidW", BOOL, [C.c_wchar_p, C.POINTER(PTR)]),
                      (self.a, "OpenProcessToken", BOOL, [HANDLE, DWORD, C.POINTER(HANDLE)]),
                      (self.a, "GetTokenInformation", BOOL, [HANDLE, C.c_int32, PTR, DWORD, PDWORD]),
                      (self.a, "EqualSid", BOOL, [PTR, PTR]),
                      (self.a, "IsValidSid", BOOL, [PTR]),
                      (self.a, "GetSidSubAuthorityCount", C.POINTER(C.c_ubyte), [PTR]),
                      (self.a, "GetSidSubAuthority", PDWORD, [PTR, DWORD]),
                      (self.k, "GetSystemDirectoryW", DWORD, [C.c_wchar_p, DWORD]),
                      (self.k, "LocalFree", PTR, [PTR]),
                      (self.k, "GetProcessHeap", HANDLE, []),
                      (self.k, "HeapFree", BOOL, [HANDLE, DWORD, PTR]),
                      (self.f, "NetworkIsolationGetAppContainerConfig", DWORD, [PDWORD, C.POINTER(C.POINTER(SID_AND_ATTRIBUTES))]),
                      (self.k, "CreateJobObjectW", HANDLE, [PTR, C.c_wchar_p]),
                      (self.k, "SetInformationJobObject", BOOL, [HANDLE, C.c_int32, PTR, DWORD]),
                      (self.k, "QueryInformationJobObject", BOOL, [HANDLE, C.c_int32, PTR, DWORD, PDWORD]),
                      (self.k, "InitializeProcThreadAttributeList", BOOL, [PTR, DWORD, DWORD, C.POINTER(SIZE)]),
                      (self.k, "UpdateProcThreadAttribute", BOOL, [PTR, DWORD, SIZE, PTR, SIZE, PTR, PTR]),
                      (self.k, "DeleteProcThreadAttributeList", None, [PTR]),
                      (self.k, "CreateProcessW", BOOL, [C.c_wchar_p, C.c_wchar_p, PTR, PTR, BOOL, DWORD, PTR, C.c_wchar_p, PTR, C.POINTER(PROCESS_INFORMATION)]),
                      (self.k, "ResumeThread", DWORD, [HANDLE]),
                      (self.k, "WaitForSingleObject", DWORD, [HANDLE, DWORD]),
                      (self.k, "GetExitCodeProcess", BOOL, [HANDLE, PDWORD]),
                      (self.k, "GetCurrentProcess", HANDLE, []),
                      (self.k, "TerminateProcess", BOOL, [HANDLE, DWORD]),
                      (self.k, "IsProcessInJob", BOOL, [HANDLE, HANDLE, C.POINTER(BOOL)]),
                      (self.k, "TerminateJobObject", BOOL, [HANDLE, DWORD]),
                      (self.k, "CloseHandle", BOOL, [HANDLE]),
                      (self.a, "CreateRestrictedToken", BOOL, [HANDLE, DWORD, DWORD, PTR, DWORD, PTR, DWORD, PTR, C.POINTER(HANDLE)]),
                      (self.a, "CreateProcessAsUserW", BOOL, [HANDLE, C.c_wchar_p, C.c_wchar_p, PTR, PTR, BOOL, DWORD, PTR, C.c_wchar_p, PTR, C.POINTER(PROCESS_INFORMATION)]),
                      (self.a, "SetTokenInformation", BOOL, [HANDLE, C.c_int32, PTR, DWORD]),
                      (self.a, "GetAclInformation", BOOL, [PTR, PTR, DWORD, C.c_int32]),
                      (self.a, "GetAce", BOOL, [PTR, DWORD, C.POINTER(PTR)]),
                      (self.a, "InitializeAcl", BOOL, [PTR, DWORD, DWORD]),
                      (self.a, "AddAce", BOOL, [PTR, DWORD, DWORD, PTR, DWORD]),
                      (self.a, "AddAccessAllowedAceEx", BOOL, [PTR, DWORD, DWORD, DWORD, PTR]),
                      (self.a, "GetLengthSid", DWORD, [PTR]),
                      (self.a, "LookupPrivilegeNameW", BOOL, [C.c_wchar_p, PTR, C.c_wchar_p, PDWORD]),
                  ]
                  for dll, name, result, args in prototypes:
                      function = getattr(dll, name)
                      function.restype, function.argtypes = result, args

              @staticmethod
              def _ok(value):
                  if not value:
                      raise C.WinError(C.get_last_error())
                  return value

              def _check_path(self, path):
                  # Never follow a junction/symlink while granting ACLs or selecting cwd.
                  for entry in (path, *path.parents):
                      stat = entry.stat(follow_symlinks=False)
                      if entry.is_symlink() or stat.st_file_attributes & REPARSE_POINT:
                          raise ValueError("reparse point forbidden in copied path: " + str(entry))

              def _utility(self, executable, args):
                  subprocess.run([str(self.system / executable), *args], check=True,
                                 timeout=self.timeout, stdin=subprocess.DEVNULL)

              def _exemption_present(self):
                  # Read-only API; never replace the global exemption list.
                  count, entries = DWORD(), C.POINTER(SID_AND_ATTRIBUTES)()
                  error = self.f.NetworkIsolationGetAppContainerConfig(C.byref(count), C.byref(entries))
                  if error:
                      raise C.WinError(error)
                  try:
                      return any(self.a.EqualSid(entries[i].Sid, self.sid) for i in range(count.value))
                  finally:
                      heap = self.k.GetProcessHeap()
                      for i in range(count.value):
                          self._ok(self.k.HeapFree(heap, 0, entries[i].Sid))
                      if entries:
                          self._ok(self.k.HeapFree(heap, 0, C.cast(entries, PTR)))

              def setup(self):
                  if self.created or self.closed:
                      raise RuntimeError("guard setup is single-use")
                  for directory, dirs, files in os.walk(self.root, followlinks=False):
                      for name in (*dirs, *files):
                          self._check_path(Path(directory) / name)
                          entry = Path(directory) / name
                          if entry.is_file() and entry.stat(follow_symlinks=False).st_nlink != 1:
                              raise ValueError("hard-linked copied files forbidden before ACL grant")
                  # Collision is a failure, never derive/reuse/delete another profile.
                  hr = self.u.CreateAppContainerProfile(self.name, self.name, self.name,
                                                        None, 0, C.byref(self.sid))
                  if hr != 0:
                      raise RuntimeError(f"CreateAppContainerProfile HRESULT=0x{hr & 0xFFFFFFFF:08x}; profile not owned")
                  self.created = True
                  if self._exemption_present():
                      raise RuntimeError("new profile SID has a preexisting exemption; not owned")
                  text = PTR()
                  self._ok(self.a.ConvertSidToStringSidW(self.sid, C.byref(text)))
                  try:
                      sid_text = C.wstring_at(text)
                      self.sid_text = sid_text
                  finally:
                      if self.k.LocalFree(text):
                          raise RuntimeError("LocalFree failed")
                  folder = PTR()
                  hr = self.u.GetAppContainerFolderPath(sid_text, C.byref(folder))
                  if hr != 0:
                      raise RuntimeError(f"GetAppContainerFolderPath HRESULT=0x{hr & 0xFFFFFFFF:08x}")
                  try:
                      self.profile_folder = Path(C.wstring_at(folder))
                  finally:
                      self.o.CoTaskMemFree(folder)
                  for arguments in windows_acl_plan(self.root, sid_text):
                      self._utility("icacls.exe", arguments)
                  # Fresh profile cannot legitimately have a preexisting exemption.
                  # Mark intent before invocation: a timeout can happen after mutation.
                  self.exempt = True
                  self._utility("CheckNetIsolation.exe", ["LoopbackExempt", "-a", f"-n={self.name}"])
                  if not self._exemption_present():
                      raise RuntimeError("loopback exemption was not installed")
                  return self

              def _token_info(self, token, kind):
                  required = DWORD()
                  ok = self.a.GetTokenInformation(token, kind, None, 0, C.byref(required))
                  if ok or C.get_last_error() != INSUFFICIENT_BUFFER or not required.value:
                      raise RuntimeError("unexpected token-information sizing result")
                  result = C.create_string_buffer(required.value)
                  self._ok(self.a.GetTokenInformation(token, kind, result, required.value, C.byref(required)))
                  return result

              def _verify_token(self, process):
                  token = HANDLE()
                  self._ok(self.a.OpenProcessToken(process, TOKEN_QUERY, C.byref(token)))
                  try:
                      app = self._token_info(token, TOKEN_APPCONTAINER)
                      package = self._token_info(token, TOKEN_PACKAGE)
                      capabilities = self._token_info(token, TOKEN_CAPABILITIES)
                      integrity = self._token_info(token, TOKEN_INTEGRITY)
                      package_sid = C.cast(package, C.POINTER(PTR)).contents.value
                      label_sid = C.cast(integrity, C.POINTER(SID_AND_ATTRIBUTES)).contents.Sid
                      self._ok(self.a.IsValidSid(package_sid))
                      self._ok(self.a.IsValidSid(label_sid))
                      count = self.a.GetSidSubAuthorityCount(label_sid).contents.value
                      if count == 0:
                          raise RuntimeError("empty integrity SID")
                      rid = self.a.GetSidSubAuthority(label_sid, count - 1).contents.value
                      validate_token_shape(C.cast(app, PDWORD).contents.value,
                                           bool(self.a.EqualSid(package_sid, self.sid)),
                                           C.cast(capabilities, PDWORD).contents.value, rid)
                  finally:
                      self._ok(self.k.CloseHandle(token))

              def _restricted_token(self):
                  """PostgreSQL src/common/restricted_token.c: deny-only admin groups, DISABLE_MAX_PRIVILEGE, user in default DACL."""
                  current, restricted, sids = HANDLE(), HANDLE(), []
                  self._ok(self.a.OpenProcessToken(self.k.GetCurrentProcess(), TOKEN_ALL_ACCESS, C.byref(current)))
                  try:
                      drop = (SID_AND_ATTRIBUTES * 2)()
                      for index, text in enumerate((ADMINS, POWER_USERS)):
                          sid = PTR()
                          self._ok(self.a.ConvertStringSidToSidW(text, C.byref(sid)))
                          sids.append(sid)
                          drop[index].Sid = sid
                      self._ok(self.a.CreateRestrictedToken(current, DISABLE_MAX_PRIVILEGE, 2, drop, 0, None, 0, None, C.byref(restricted)))
                  finally:
                      try:
                          for sid in sids:
                              if self.k.LocalFree(sid):
                                  raise RuntimeError("LocalFree failed for dropped group SID")
                      finally:
                          self._ok(self.k.CloseHandle(current))
                  try:
                      # exec.c AddUserToTokenDacl: backends must open objects the restricted postmaster creates.
                      acl = C.cast(self._token_info(restricted, TOKEN_DEFAULT_DACL), C.POINTER(PTR)).contents.value
                      size = ACL_SIZE()
                      self._ok(self.a.GetAclInformation(acl, C.byref(size), C.sizeof(size), ACL_SIZE_INFO))
                      user = self._token_info(restricted, TOKEN_USER)
                      user_sid = C.cast(user, C.POINTER(SID_AND_ATTRIBUTES)).contents.Sid
                      length = size.AclBytesInUse + 8 + self._ok(self.a.GetLengthSid(user_sid))
                      dacl = C.create_string_buffer(length)
                      self._ok(self.a.InitializeAcl(dacl, length, ACL_REVISION))
                      if size.AceCount:
                          first = PTR()
                          self._ok(self.a.GetAce(acl, 0, C.byref(first)))
                          self._ok(self.a.AddAce(dacl, ACL_REVISION, WAIT_FAILED, first, size.AclBytesInUse - 8))
                      self._ok(self.a.AddAccessAllowedAceEx(dacl, ACL_REVISION, OBJECT_INHERIT, GENERIC_ALL, user_sid))
                      default = PTR(C.addressof(dacl))
                      self._ok(self.a.SetTokenInformation(restricted, TOKEN_DEFAULT_DACL, C.byref(default), C.sizeof(default)))
                      return restricted
                  except BaseException:
                      self.k.CloseHandle(restricted)
                      raise

              def _token_identity(self, token):
                  def text(sid):
                      value = PTR()
                      self._ok(self.a.ConvertSidToStringSidW(sid, C.byref(value)))
                      try:
                          return C.wstring_at(value)
                      finally:
                          if self.k.LocalFree(value):
                              raise RuntimeError("LocalFree failed")
                  user = text(C.cast(self._token_info(token, TOKEN_USER), C.POINTER(SID_AND_ATTRIBUTES)).contents.Sid)
                  raw = self._token_info(token, TOKEN_GROUPS)
                  groups = {}
                  for entry in (SID_AND_ATTRIBUTES * C.cast(raw, PDWORD).contents.value).from_buffer(raw, C.alignment(SID_AND_ATTRIBUTES)):
                      sid = text(entry.Sid)
                      groups[sid] = groups.get(sid, 0) | entry.Attributes  # A duplicate SID never hides an enabled entry.
                  raw = self._token_info(token, TOKEN_PRIVILEGES)
                  privileges = []
                  for entry in (LUID_AND_ATTRIBUTES * C.cast(raw, PDWORD).contents.value).from_buffer(raw, C.sizeof(DWORD)):
                      name, size = C.create_unicode_buffer(256), DWORD(256)
                      self._ok(self.a.LookupPrivilegeNameW(None, C.byref(entry), name, C.byref(size)))
                      privileges.append(name.value)
                  return user, groups, privileges

              def _verify_restricted(self, process):
                  identities = []
                  for handle in (self.k.GetCurrentProcess(), process):
                      token = HANDLE()
                      self._ok(self.a.OpenProcessToken(handle, TOKEN_QUERY, C.byref(token)))
                      try:
                          identities.append(self._token_identity(token))
                      finally:
                          self._ok(self.k.CloseHandle(token))
                  (expected, _, _), (user, groups, privileges) = identities
                  validate_restricted_token(user, expected, groups, privileges)

              @classmethod
              def attest_current(cls, sid_text):
                  """Called by the child/grandchild itself; no profile or ACL mutation."""
                  if os.name != "nt":
                      raise RuntimeError("native token attestation NOT_RUN on this host")
                  guard = object.__new__(cls)
                  guard.k = C.WinDLL("kernel32", use_last_error=True)
                  guard.a = C.WinDLL("advapi32", use_last_error=True)
