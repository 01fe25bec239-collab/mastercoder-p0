                      ("CREATE TEMP TABLE ws03_read_control(line text); COPY ws03_read_control FROM '" +
                       path.removesuffix('__ws03_denied__') + "pg_hba.conf'", 'permission denied to COPY from a file', 'pg_read_server_files'),
                      ("SELECT pg_read_file('pg_hba.conf')", 'permission denied for function pg_read_file', None)]:
                  pg_denied(lambda: sql(query), '42501', reason, detail)
              return {'limited_role': PG_ROLE, 'database': PG_DATABASE, 'migration_rollback': True,
                      'admin_alternate_replication_rejected': True, 'program_file_escalation_denied': True}


          def dns_answer(packet, ipv4):
              # Synthetic authoritative A/AAAA responses, TTL zero avoids positive-cache masking.
              if len(packet) < 17 or packet[4:6] != b'\0\1':
                  raise ValueError('Invalid fixture DNS request')
              offset, labels = 12, []
              while packet[offset]:
                  size = packet[offset]
                  if size > 63 or offset + size + 1 >= len(packet):
                      raise ValueError('Invalid fixture DNS label')
                  labels.append(packet[offset + 1:offset + 1 + size].decode('ascii'))
                  offset += size + 1
              end = offset + 5
              qtype, qclass = struct.unpack('!HH', packet[offset + 1:end])
              if qclass != 1 or end > len(packet):
                  raise ValueError('Unsupported fixture DNS question')
              answer = b''
              if qtype == 1:
                  answer = b'\xc0\x0c' + struct.pack('!HHIH', 1, 1, 0, 4) + socket.inet_aton(ipv4)
              return (packet[:2] + struct.pack('!HHHHH', 0x8180, 1, bool(answer), 0, 0)
                      + packet[12:end] + answer), '.'.join(labels)


          def fixture_sockaddr(family, address, port):
              return socket.getaddrinfo(address, port, family, socket.SOCK_DGRAM,
                                        0, socket.AI_NUMERICHOST | socket.AI_NUMERICSERV)[0][4]


          def mac_fixture_addresses(listing):
              candidates = {socket.AF_INET: [], socket.AF_INET6: []}
              usable = False
              interface = None
              for line in listing.splitlines():
                  if line and not line[0].isspace():
                      interface = line.split(':', 1)[0]
                      flags = set(line.partition('<')[2].partition('>')[0].split(','))
                      usable = 'UP' in flags and 'LOOPBACK' not in flags
                  fields = line.split()
                  if not usable or len(fields) < 2 or fields[0] not in ('inet', 'inet6'):
                      continue
                  address = fields[1]
                  ip = ipaddress.ip_address(address.split('%')[0])
                  if ip.is_loopback or ip.is_unspecified or ip.is_multicast or {'tentative', 'duplicated'} & set(fields):
                      continue
                  if ip.version == 6 and ip.is_link_local and '%' not in address:
                      address += '%' + interface
                  candidates[socket.AF_INET if ip.version == 4 else socket.AF_INET6].append(address)
              selected, failures = [], []
              for family in (socket.AF_INET, socket.AF_INET6):
                  for address in candidates[family]:
                      try:
                          for kind in (socket.SOCK_STREAM, socket.SOCK_DGRAM):
                              with socket.socket(family, kind) as sock:
                                  sock.bind(fixture_sockaddr(family, address, 0))
                      except OSError as error:
                          failures.append({'family': family, 'address': address, 'errno': error.errno, 'error': str(error)[:512]})
                      else:
                          selected.append(address)
                          break
                  else:
                      raise RuntimeError('No bindable nonloopback fixture address: ' + json.dumps({'family': family, 'selected': selected, 'rejected': failures})[:4096])
              return selected, failures


          def serve(config_path):
              config = json.loads(Path(config_path).read_text())
              if sys.platform == 'linux':
                  status = dict(line.split(':', 1) for line in Path('/proc/self/status').read_text().splitlines() if ':' in line)
                  require_unprivileged(status, os.geteuid(), os.getgroups())
                  config['fixture_privilege'] = {key: status[key].strip() for key in ('NoNewPrivs', 'CapEff', 'CapBnd', 'CapInh', 'CapAmb')}
                  config['fixture_uid'] = os.geteuid()
              sockets, threads, errors = [], [], []
              stop = threading.Event()
              def worker(sock, protocol):
                  try:
                      while not stop.is_set():
                          try:
                              if protocol == 'tcp':
                                  conn, _ = sock.accept()
                                  with conn:
                                      conn.settimeout(config['timeout'])
                                      conn.sendall(config['canary'].encode())
                              else:
                                  data, addr = sock.recvfrom(4096)
                                  if protocol == 'dns':
                                      reply, name = dns_answer(data, config['ipv4'])
                                      with Path(config['dns_log']).open('a') as output:
                                          output.write(name + '\n')
                                      sock.sendto(reply, addr)
                                  elif data == config['canary'].encode():
                                      sock.sendto(data, addr)
                                  else:
                                      raise ValueError('Unexpected fixture canary')
                          except socket.timeout:
                              continue
                  except BaseException as error:
                      errors.append(type(error).__name__ + ': ' + str(error)[:512])
                      stop.set()
              try:
                  endpoints = []
                  for family, address in ((socket.AF_INET, config['ipv4']), (socket.AF_INET6, config['ipv6']),
                                          (socket.AF_INET, '127.0.0.1'), (socket.AF_INET6, '::1')):
                      for protocol in ('tcp', 'udp'):
                          sock = socket.socket(family, socket.SOCK_STREAM if protocol == 'tcp' else socket.SOCK_DGRAM)
                          sock.settimeout(config['timeout'])
                          sockets.append(sock)
                          try:
                              sock.bind(fixture_sockaddr(family, address, 0))
                          except OSError as error:
                              raise RuntimeError('Fixture bind failed: ' + json.dumps({'family': family, 'address': address,
                                  'protocol': protocol, 'errno': error.errno, 'error': str(error)[:512]})) from error
                          if protocol == 'tcp':
                              sock.listen()
                          endpoints.append({'family': family, 'address': address, 'port': sock.getsockname()[1],
                                            'protocol': protocol, 'loopback': ipaddress.ip_address(address.split('%')[0]).is_loopback})
                          threads.append(threading.Thread(target=worker, args=(sock, protocol)))
                  if sys.platform == 'darwin':
                      for endpoint in list(endpoints):
                          if not endpoint['loopback']:
                              continue
                          address = config['ipv4'] if endpoint['family'] == socket.AF_INET else config['ipv6']
                          duplicate = next((item for item in endpoints if item['address'] == address
                              and item['protocol'] == endpoint['protocol'] and item['port'] == endpoint['port']), None)
                          if duplicate is not None:
                              duplicate['same_port_control'] = True
                              continue
                          sock = socket.socket(endpoint['family'], socket.SOCK_STREAM if endpoint['protocol'] == 'tcp' else socket.SOCK_DGRAM)
                          sockets.append(sock)
                          sock.settimeout(config['timeout'])
                          sock.bind(fixture_sockaddr(endpoint['family'], address, endpoint['port']))
                          if endpoint['protocol'] == 'tcp':
                              sock.listen()
                          endpoints.append(dict(endpoint, address=address, loopback=False, same_port_control=True))
                          threads.append(threading.Thread(target=worker, args=(sock, endpoint['protocol'])))
                      if sum(bool(item.get('same_port_control')) for item in endpoints) != 4:
                          raise RuntimeError('Missing dual-family same-port TCP/UDP nonloopback controls')
                  dns = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                  dns.settimeout(config['timeout'])
                  sockets.append(dns)
                  dns.bind(fixture_sockaddr(socket.AF_INET, config['ipv4'], config['dns_port']))
                  threads.append(threading.Thread(target=worker, args=(dns, 'dns')))
                  config['dns_port'] = dns.getsockname()[1]
                  config['endpoints'] = endpoints
                  for thread in threads:
                      thread.start()
                  ready = Path(config['ready'])
                  temporary = ready.with_suffix('.new')
                  temporary.write_text(json.dumps(config))
                  temporary.replace(ready)
                  deadline = time.monotonic() + config['lifetime']
                  while not stop.wait(min(config['timeout'], max(0, deadline - time.monotonic()))):
                      if Path(config['stop']).exists() or time.monotonic() >= deadline:
                          break
              finally:
                  stop.set()
                  for thread in threads:
                      if thread.ident is not None:
                          thread.join(config['timeout'] + 1)
                  for sock in sockets:
                      sock.close()
              if errors or any(thread.is_alive() for thread in threads):
                  raise RuntimeError('Fixture failed: ' + ','.join(errors))


          def check_results(results, denied):
              # A removed guard must fail this exact predicate; outage alone never establishes denial.
              for result in results:
                  expected = not denied or result['loopback']
                  if result['reachable'] != expected:
                      raise RuntimeError('Network expectation failed: ' + result['name'])
                  if not expected and result['error'] not in ('policy', 'timeout', 'dns-denied'):
                      raise RuntimeError('Unsupported network/interface error: ' + result['name'])


          def probe(config_path, mode, phase, descendant=False):
              config = json.loads(Path(config_path).read_text())
              if mode == 'deny':
                  if sys.platform == 'win32':
                      WindowsGuard.attest_current(config['package_sid'])
                      for path in config['protected_write_targets']:
                          try:
                              with Path(path).open('ab') as target:
                                  target.write(b'UNEXPECTED-CONTROL-WRITE')
                          except PermissionError:
                              pass
                          else:
                              raise RuntimeError('Protected control/runtime/PG path was writable: ' + path)
                      try:
                          Path(config['protected_pid']).unlink()
                      except PermissionError:
                          pass
                      else:
                          raise RuntimeError('Protected PostgreSQL PID file was removable')
                  elif sys.platform == 'linux':
                      status = dict(line.split(':', 1) for line in Path('/proc/self/status').read_text().splitlines() if ':' in line)
                      if (os.geteuid() == 0 or status['NoNewPrivs'].strip() != '1'
                              or any(int(status[key].strip(), 16) for key in ('CapEff', 'CapBnd', 'CapInh', 'CapAmb'))):
                          raise RuntimeError('Restricted process retained privilege or escalation')
                      if not {'lo', 'fixture0'} == {name for _, name in socket.if_nameindex()}:
                          raise RuntimeError('Unexpected namespace interface')
                  elif sys.platform == 'darwin':
                      attest_mac_identity(config)
                      for path in config['mac_protected_write_targets']:
                          try:
                              with Path(path).open('ab') as target:
                                  target.write(b'UNEXPECTED-CONTROL-WRITE')
                          except PermissionError:
                              pass
                          else:
                              raise RuntimeError('Protected macOS controller/runtime path was writable: ' + path)
                      sandbox = ctypes.CDLL(config['seatbelt_library'])
                      sandbox.sandbox_check.restype = ctypes.c_int
                      # sandbox_check's varargs ABI: pid, operation, filter=0 (no path), no extra argument.
                      if sandbox.sandbox_check(ctypes.c_int(os.getpid()), ctypes.c_char_p(b'network-outbound'), ctypes.c_int(0)) != 1:
                          raise RuntimeError('Seatbelt network policy denial is absent or unsupported')
                      # sandbox_check needs concrete operation names; the 'ipc-posix-shm' class name returns -1 (unknown).
                      for operation in (b'mach-lookup', b'mach-register', b'ipc-posix-shm-write-create', b'ipc-posix-sem-create'):
                          if sandbox.sandbox_check(ctypes.c_int(os.getpid()), ctypes.c_char_p(operation), ctypes.c_int(0)) != 1:
                              raise RuntimeError('Seatbelt IPC denial is absent or unsupported')
                      try:
                          os.link(__file__, str(Path(config['output']) / ('denied-link-' + str(os.getpid()))))
                      except PermissionError:
                          pass
                      else:
                          raise RuntimeError('Privileged executable hardlink route was allowed')
                      try:
                          checked(['/usr/bin/sudo', '-n', '/usr/bin/true'], timeout=config['timeout'])
                      except PermissionError:
                          pass
                      else:
                          raise RuntimeError('Unsafe privileged launcher was executable')
              if sys.platform == 'darwin':
                  attest_mac_identity(config)
              results = []
              allowed_errors = {errno.EACCES, errno.EPERM, errno.ENETUNREACH, errno.EHOSTUNREACH, 10013, 10051, 10065}
              for endpoint in config['endpoints']:
                  result = {'name': endpoint['address'] + ':' + endpoint['protocol'],
                            'loopback': endpoint['loopback'], 'same_port_control': endpoint.get('same_port_control', False),
                            'reachable': False, 'error': None}
                  with socket.socket(endpoint['family'], socket.SOCK_STREAM if endpoint['protocol'] == 'tcp' else socket.SOCK_DGRAM) as conn:
                      conn.settimeout(config['timeout'])
                      try:
                          if endpoint['protocol'] == 'tcp':
                              conn.connect(fixture_sockaddr(endpoint['family'], endpoint['address'], endpoint['port']))
                              data = b''
                              while len(data) < len(config['canary']):
                                  part = conn.recv(len(config['canary']) - len(data))
                                  if not part:
                                      break
                                  data += part
                          else:
                              conn.sendto(config['canary'].encode(), fixture_sockaddr(endpoint['family'], endpoint['address'], endpoint['port']))
                              data, peer = conn.recvfrom(4096)
                              if peer[1] != endpoint['port']:
                                  raise RuntimeError('Fixture response from wrong port')
                          if data != config['canary'].encode():
                              raise RuntimeError('Fixture canary mismatch')
                          result['reachable'] = True
                      except socket.timeout:
                          result['error'] = 'timeout'
                      except OSError as error:
                          if error.errno not in allowed_errors and getattr(error, 'winerror', None) not in allowed_errors:
                              raise
                          result['error'] = 'policy'
                  results.append(result)
              # Direct DNS is additional coverage, never a substitute for getaddrinfo/broker.
              name = phase + '-' + ('child' if descendant else 'parent') + '.' + config['domain']
              result = {'name': 'system-dns:' + name, 'loopback': False, 'reachable': False, 'error': None}
              try:
                  if config['ipv4'] not in native_dns(name):
                      raise RuntimeError('DNS returned an unexpected fixture address')
                  result['reachable'] = True
              except socket.gaierror as error:
                  if error.errno not in (socket.EAI_AGAIN, socket.EAI_NONAME, socket.EAI_FAIL, 11001, 11002):
                      raise
                  result['error'] = 'dns-denied'
              results.append(result)
              direct_name = 'wire-' + name
              packet = b'\x12\x34\x01\x00\x00\x01\x00\x00\x00\x00\x00\x00'
              packet += b''.join(bytes([len(x)]) + x.encode() for x in direct_name.split('.')) + b'\0\0\1\0\1'
              result = {'name': 'direct-dns', 'loopback': False, 'reachable': False, 'error': None}
              with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as conn:
                  conn.settimeout(config['timeout'])
                  try:
                      conn.sendto(packet, (config['ipv4'], config['dns_port']))
                      answer, _ = conn.recvfrom(4096)
                      if answer != dns_answer(packet, config['ipv4'])[0]:
                          raise RuntimeError('DNS fixture reply mismatch')
                      result['reachable'] = True
                  except socket.timeout:
                      result['error'] = 'timeout'
                  except OSError as error:
                      if error.errno not in allowed_errors and getattr(error, 'winerror', None) not in allowed_errors:
                          raise
                      result['error'] = 'policy'
              results.append(result)
              query_pg(config['pg_port'], config['timeout'])
              authority = pg_authority(config) if not descendant else None
              Path(config['output'], phase + ('-child' if descendant else '-parent') + '.json').write_text(json.dumps({
                  'pid': os.getpid(), 'parent': os.getppid(), 'platform': platform.platform(), 'mode': mode,
                  'postgres_select_1': True, 'postgres_authority': authority, 'results': results}, indent=2))
              if mode != 'mutation':
                  check_results(results, mode == 'deny')
              else:
                  check_results(results, False)
                  try:
                      check_results(results, True)
                  except RuntimeError:
                      pass
                  else:
                      raise RuntimeError('Removed guard escaped the denial checker')
              if not descendant:
                  checked([sys.executable, '-I', __file__, 'probe-child', config_path, mode, phase], timeout=config['command_timeout'])


          def windows_acl_plan(root, sid):
              # Protected medium controls; package RX only on required runtime/config paths.
              plan = [[str(root), '/setintegritylevel', '(OI)(CI)M', '/T', '/L'],
                      [str(root), '/grant:r', f'*{sid}:RX', '/L']]
              for name in ('python', 'toolchain'):
                  plan.append([str(root / name), '/grant:r', f'*{sid}:(OI)(CI)RX', '/T', '/L'])
              for name in ('helper.py', 'tests.py', 'probe.json'):
                  plan.append([str(root / name), '/grant:r', f'*{sid}:R', '/L'])
              for name in writable_directories():
                  plan.append([str(root / name), '/grant:r', f'*{sid}:(OI)(CI)M', '/T', '/L'])
                  plan.append([str(root / name), '/setintegritylevel', '(OI)(CI)L', '/T', '/L'])
              return plan


          def require_unprivileged(status, uid, groups):
              if (uid == 0 or groups or status['NoNewPrivs'].strip() != '1'
                      or any(int(status[key].strip(), 16) for key in ('CapEff', 'CapBnd', 'CapInh', 'CapAmb'))):
                  raise RuntimeError('Fixture retained privilege or escalation')


          def writable_directories():
              return ('work', 'home', 'temp', 'cargo', 'rustup', 'output')


          def trusted_system(path):
              path = Path(path).resolve(strict=True)
              for entry in (path, *path.parents):
                  info = entry.stat()
                  if info.st_uid != 0 or info.st_mode & 0o022 or os.access(entry, os.W_OK):
                      raise RuntimeError('Privileged tool chain is writable: ' + str(entry))
              if not path.is_file():
                  raise RuntimeError('Missing trusted system executable')
              return str(path)


          def privileged(argv):
              # No privileged Python/imports, PATH lookup, caller cwd or inherited environment.
              return [trusted_system('/usr/bin/sudo'), '-n', trusted_system('/usr/bin/env'), '-i',
                      'PATH=/usr/bin:/bin:/usr/sbin:/sbin', trusted_system(argv[0]), *map(str, argv[1:])]


          def drop_identity():
              if os.getuid() == 0 or os.getgid() == 0:
                  raise RuntimeError('Expected an unprivileged runner identity')
              return [trusted_system('/usr/bin/setpriv'), '--reuid', str(os.getuid()), '--regid', str(os.getgid()),
                      '--clear-groups', '--inh-caps=-all', '--ambient-caps=-all', '--bounding-set=-all', '--no-new-privs', '--']


          def safe_env(root):
              # No inherited GitHub credentials, provider secrets, proxy or host key variables.
              # ProgramData/ProgramFiles* are non-secret and vswhere cannot find Visual Studio instances without them.
              allowed = ('PATH', 'SystemRoot', 'WINDIR', 'COMSPEC', 'PATHEXT', 'NUMBER_OF_PROCESSORS',
                         'ProgramData', 'ProgramFiles', 'ProgramFiles(x86)', 'ProgramW6432')
              env = {key: os.environ[key] for key in allowed if key in os.environ}
              env.update({'HOME': str(root / 'home'), 'USERPROFILE': str(root / 'home'),
                          'TEMP': str(root / 'temp'), 'TMP': str(root / 'temp'),
                          'CARGO_HOME': str(root / 'cargo'), 'RUSTUP_HOME': str(root / 'rustup'),
                          'CARGO_BUILD_JOBS': '2', 'CARGO_INCREMENTAL': '0', 'PYTHONDONTWRITEBYTECODE': '1'})
              return env


          # PROTOTYPE — DISPOSABLE — NOT PRODUCTION (Mastercoder freeze-closure)
          def windows_tool_path(value, roots):
              from pathlib import PureWindowsPath
              path = PureWindowsPath(value)
              if (not path.is_absolute() or '..' in path.parts or any(c in value for c in '"&|<>^%\r\n!')
                      or not any(path.is_relative_to(PureWindowsPath(root)) for root in roots)):
                  raise ValueError('Native toolkit path is outside installed roots: ' + value)
              native = Path(str(path))
              if not native.exists() or native.is_symlink() or native.resolve() != native:
                  raise ValueError('Native toolkit path is absent or redirected')
              return str(native)


          def msvc_environment(raw, installation, program_files, system_root):
              # Only installed SDK/tool paths survive SET; never inherit provider variables or CL injection.
              from pathlib import PureWindowsPath
              entries = {}
              allowed = {'PATH', 'LIB', 'INCLUDE', 'LIBPATH', 'VCTOOLSINSTALLDIR', 'WINDOWSSDKDIR',
                         'WINDOWSSDKVERSION', 'VSCMD_ARG_HOST_ARCH', 'VSCMD_ARG_TGT_ARCH'}
              for line in raw.splitlines():
                  key, separator, value = line.partition('=')
                  key = key.upper()
                  if separator and key in allowed:
                      if key in entries or not value or '\0' in value:
                          raise ValueError('Malformed or repeated developer environment variable: ' + key)
                      entries[key] = value
              if set(entries) != allowed or any(entries[key] != 'x64' for key in ('VSCMD_ARG_HOST_ARCH', 'VSCMD_ARG_TGT_ARCH')):
                  raise ValueError('Missing x64 developer environment')
              if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\\?', entries['WINDOWSSDKVERSION']):
                  raise ValueError('Malformed Windows SDK version')
              vs = windows_tool_path(installation, program_files)
              sdk_roots = [str(PureWindowsPath(root) / 'Windows Kits') for root in program_files]
              vc = windows_tool_path(entries['VCTOOLSINSTALLDIR'], [vs])
              sdk = windows_tool_path(entries['WINDOWSSDKDIR'], sdk_roots)
              # LIB/INCLUDE also list Windows Kits siblings of the SDK dir, e.g. NETFXSDK.
              roots = [vs, *sdk_roots, str(PureWindowsPath(system_root) / 'Microsoft.NET')]
              result = {}
              for key in ('LIB', 'INCLUDE', 'LIBPATH'):
                  parts = entries[key].rstrip(';').split(';')
                  if not all(parts):
                      raise ValueError('Empty developer toolkit path')
                  result[key] = ';'.join(windows_tool_path(value, roots) for value in parts)
              binaries = str(PureWindowsPath(vc) / 'bin/Hostx64/x64')
              tools = {name: windows_tool_path(str(PureWindowsPath(binaries) / (name + '.exe')), [vc])
                       for name in ('cl', 'link')}
              # Discard Git/usr/bin and any other ambient PATH component, including current directory.
              paths = [binaries]
              for value in entries['PATH'].rstrip(';').split(';'):
                  candidate = PureWindowsPath(value)
                  if candidate.is_absolute() and any(candidate.is_relative_to(PureWindowsPath(root)) for root in (vs, sdk)):
                      paths.append(windows_tool_path(value, [vs, sdk]))
              paths.append(windows_tool_path(str(PureWindowsPath(system_root) / 'System32'), [system_root]))
              result['PATH'] = ';'.join(dict.fromkeys(paths))
              if shutil.which('link.exe', path=result['PATH']) != tools['link'] or shutil.which('cl.exe', path=result['PATH']) != tools['cl']:
                  raise RuntimeError('Selected compiler/linker is not the installed x64 MSVC tool')
              result['CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER'] = tools['link']
              result['CC'], result['CXX'] = tools['cl'], tools['cl']
              return result, tools


          def setup_msvc(root, env, timeout):
              program_files = [os.environ['ProgramFiles'], os.environ['ProgramFiles(x86)']]
              system_root = os.environ['SystemRoot']
              vswhere = windows_tool_path(str(Path(program_files[1]) / 'Microsoft Visual Studio/Installer/vswhere.exe'), program_files)
              discovery = ''
              try:
                  # vswhere's redirected default encoding is console-dependent; request UTF-8 explicitly.
                  discovery = subprocess.check_output([vswhere, '-latest', '-products', '*', '-requires',
                      'Microsoft.VisualStudio.Component.VC.Tools.x86.x64', '-property', 'installationPath', '-utf8'],
                      env=env, text=True, encoding='utf-8-sig', errors='strict', timeout=timeout)
                  paths = discovery.splitlines()
                  if len(paths) != 1 or not paths[0] or '\0' in paths[0]:
                      raise ValueError('Expected exactly one installation path')
                  installation = windows_tool_path(paths[0], program_files)
              except (ValueError, UnicodeError) as error:
                  # Only discovery/tool roots, never the inherited or captured developer environment.
                  diagnostic = {'phase': 'vswhere-installation-validation', 'allowed_roots': program_files,
                                'discovery': discovery[:1024], 'discovery_length': len(discovery),
                                'reason': str(error)[:256]}
                  raise ValueError('MSVC discovery refused: ' + json.dumps(diagnostic)) from error
              devcmd = windows_tool_path(str(Path(installation) / 'Common7/Tools/VsDevCmd.bat'), [installation])
              command = windows_tool_path(str(Path(system_root) / 'System32/cmd.exe'), [system_root])
              script = root / 'developer-env.cmd'
              script.write_text('@echo off\ncall "' + devcmd + '" -arch=x64 -host_arch=x64 >nul\n'
                                'if errorlevel 1 exit /b 1\nset\n')
              raw = subprocess.check_output([command, '/d', '/c', str(script)], cwd=root, env=env, text=True, timeout=timeout)
              selected, tools = msvc_environment(raw, installation, program_files, system_root)
              env.update(selected)
              return {name: {'path': path, 'sha256': hashlib.sha256(Path(path).read_bytes()).hexdigest()}
                      for name, path in dict(tools, vswhere=vswhere, VsDevCmd=devcmd, cmd=command).items()}


