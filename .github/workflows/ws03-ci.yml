          // PROTOTYPE — DISPOSABLE — NOT PRODUCTION (Mastercoder freeze-closure)
          // CI-only SDK adapter. Native compilation/runtime remain NOT_RUN locally.
          // Microsoft FWPM_SESSION0/FwpmFilterAdd0: a dynamic session removes its objects
          // on close; ALE_PACKAGE_ID restricts every filter to this job's AppContainer SID.
          #define WIN32_LEAN_AND_MEAN
          #define _WIN32_WINNT 0x0A00
          #include <windows.h>
          #include <initguid.h>
          #include <fwpmu.h>
          #include <sddl.h>
